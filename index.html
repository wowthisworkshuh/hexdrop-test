<style>
/* Layout: one screen. Menu replaces the play column. In play the order is
   HUD, queue rail (moved to the top so the banner ad can never cover it),
   board, ad band. */
:root{
  --ink:#0C1119; --ink-2:#141C29; --ink-3:#1D2838;
  --line:#2B3A52; --fg:#E9EEF7; --dim:#9CACC5;
  --accent:#FFC24B; --danger:#FF5B6E;
  /* the rest of the colourway's UI theme (applyTheme sets all of these from
     THEMES when the colourway changes; these are Signal's) */
  --accent-rgb:255,194,75; --danger-rgb:255,91,110; --accent-ink:#0A0D12; --danger-text:#FF9BA0;
  --sheet:#080C13; --sheet-rgb:8,12,19; --rowalt:#111826; --podium:#3A4A66; --goad:#C3CEE0;
  --t1:#16275E; --t2:#24538F; --t3:#2E7F9B; --t4:#5FA87A; --t5:#F2B65C; --t6:#F7F3EA;
  --k1:#FFFFFF; --k2:#FFFFFF; --k3:#FFFFFF; --k4:#0A0D12; --k5:#0A0D12; --k6:#0A0D12;
  --font-scale: 1;              /* the phone's own text-size setting (pushed in by the app) */
  --zoom: 1;                    /* pinch or Text size: menus and sheets only, never the board */
  --fs: var(--font-scale);
  color-scheme: dark;
}
.sheet,.menu,.veil{--fs:calc(var(--font-scale) * var(--zoom))}
/* The artifact host injects this rule, but a raw WebView does not — and author
   `display:flex` on .menu/.hud/.rail/.board outranks the user-agent [hidden]
   rule, because author styles always beat UA styles. Without this every screen
   renders at once in the APK. Keep the page self-sufficient outside the viewer. */
[hidden]{display:none!important}
/* Rapid taps must not trigger browser double-tap zoom on the HUD or controls.
   Keep pinch permission here; the board and text-zoom surfaces refine it below. */
html,body{height:100%;touch-action:manipulation}
/* the safe areas matter once the page runs full screen from an iPhone's Home
   Screen (the notch above, the home bar below); everywhere else they are 0 */
body{margin:0;background:var(--ink);color:var(--fg);box-sizing:border-box;
  font-family:Lexend,"Helvetica Neue",Arial,sans-serif;font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .5s ease}
@media (prefers-reduced-motion: reduce){ body{transition:none} }
.wrap{display:flex;flex-direction:column;gap:8px;height:100%;max-width:430px;width:100%;

/* ---------- menu ---------- */

  overflow-y:auto;overscroll-behavior:contain;padding-block:22px 16px;justify-content:flex-start}

.logo{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(38px,12vw,56px);

.mode{flex-wrap:wrap;row-gap:4px}

  font-size:calc(14px * var(--fs));color:var(--accent);white-space:nowrap}

.menurow{display:flex;gap:9px;flex-wrap:wrap}
.menurow button{flex:1 1 40%}
.mbtn{background:var(--ink-3);border:1px solid var(--line);color:var(--fg);border-radius:12px;
  padding:13px 10px;cursor:pointer;font-family:Lexend,sans-serif;font-weight:600;
  font-size:calc(14px * var(--fs));letter-spacing:.04em}
.mbtn:hover{border-color:var(--accent)}
.mbtn.share{flex:1 1 100%}
.sharepill{min-height:40px;border-radius:999px;border:1px solid var(--dim);background:transparent;color:var(--fg);
  font-family:Lexend,sans-serif;font-weight:700;font-size:calc(14px * var(--fs));letter-spacing:.03em;
  padding:6px 16px;cursor:pointer;max-width:100%}
.sharepill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sharebox{-webkit-user-select:text;user-select:text;box-sizing:border-box;width:100%;min-height:calc(110px * var(--fs));
  font-family:Lexend,sans-serif;font-size:max(16px,calc(17px * var(--fs)));line-height:1.45;color:var(--fg);
  background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:none}
.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- in-play chrome ---------- */
/* Seven-digit scores at 1.5x system font used to run off the side of the HUD.
   Three defences: Best sits under Score instead of beside it, the number shrinks
   as it grows (paintScore), and the row wraps rather than clipping if it still
   cannot fit. */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:10px 0;flex:0 0 auto;flex-wrap:wrap;row-gap:4px}
.hudl{display:flex;align-items:center;gap:8px;min-width:0}
.modepill{font-family:Lexend,sans-serif;font-weight:700;
  font-size:calc(13px * var(--fs));letter-spacing:.1em;text-transform:uppercase;

.stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;

.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}

button.ghost{background:var(--ink-3);border:1px solid var(--dim);color:var(--fg);
  width:34px;height:34px;border-radius:10px;font-size:17px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-family:Lexend,sans-serif;font-weight:700;
  flex:0 0 auto}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
button.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* queue rail — now above the board */
.rail{display:flex;align-items:center;justify-content:space-between;gap:9px;flex:0 0 auto;
  background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.railgrp{display:flex;align-items:center;gap:9px;min-width:0}

  color:var(--dim);white-space:nowrap}

.chip.now{width:44px;height:44px}
/* On phones narrower than about 410px (every recent iPhone) the full rail is
   wider than the screen and HOLD used to cover the second NEXT tile. fitRail()
   steps through these until nothing overlaps: tighter spacing, then smaller
   tiles and a smaller HOLD, then the NOW/NEXT words go (the big tile is still
   first), and last of all the controls drop to a second line. */
.rail.c1{gap:6px}
.rail.c1 .railgrp,.rail.c1 .ctrls{gap:6px}

.rail.c1 button.ui{padding:8px 9px;gap:5px;letter-spacing:.03em}
.rail.c2{padding:8px 9px}
.rail.c2 .chip{width:26px;height:26px}
.rail.c2 .chip.now{width:38px;height:38px}
.rail.c2 #chipHold{width:22px!important;height:22px!important}
.rail.c2 button.ui{font-size:calc(10.5px * var(--fs))}
.rail.c2 button.ghost{width:30px;height:30px;font-size:15px}
.rail.c3 .railgrp .lab{display:none}
.rail.c3 #chipN1{margin-left:4px}
.rail.c4{flex-wrap:wrap;row-gap:6px}
.rail.c4 .ctrls{margin-left:auto}
.ctrls{display:flex;align-items:center;gap:8px}
button.ui{background:var(--ink-3);border:1px solid var(--dim);color:var(--fg);border-radius:11px;
  font-family:Lexend,sans-serif;font-size:calc(12px * var(--fs));font-weight:700;

button.ui:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.board{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
/* The board owns every touch on it (no scroll, no zoom, no tap delay). Other
   canvases, the help animations, must let a vertical drag through to the
   sheet, or a swipe that happens to start on one goes nowhere. */
#cv{touch-action:none}
canvas.demo{touch-action:pan-y}
.combo{position:absolute;top:8px;left:50%;width:100%;transform:translateX(-50%);

.combo-head{font-family:Lexend,sans-serif;font-weight:700;font-size:28px;

.combo-rail{position:relative;width:100%;height:0}
.drop{position:absolute;left:50%;top:4px;white-space:nowrap;
  font-family:Lexend,sans-serif;font-weight:700;font-size:13px;letter-spacing:.09em;
  color:var(--fg);animation:dropaway 950ms cubic-bezier(.33,.55,.4,1) forwards}
@keyframes dropaway{0%{opacity:0;transform:translate(-50%,-8px)}
  16%{opacity:.95;transform:translate(-50%,2px)}100%{opacity:0;transform:translate(-50%,52px)}}
@keyframes dropfade{0%{opacity:0}16%{opacity:.95}100%{opacity:0}}

.adband{flex:0 0 auto;padding-bottom:10px}

  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:13px;
  overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;

  line-height:1.55;margin:-2px 0 2px}
.tagline #buildTag{cursor:default;-webkit-user-select:none;user-select:none;
  padding:2px 4px;border-radius:5px}

.dbg{border-color:#7F8CA6;background:rgba(127,140,166,.1)}
.final{font-family:Lexend,sans-serif;font-weight:700;line-height:1.05;
  font-variant-numeric:tabular-nums;max-width:100%;word-break:keep-all;
  font-size:clamp(26px,11vw,48px)}
.combo-head{max-width:94%}
.btn{font-family:Lexend,sans-serif;font-weight:700;font-size:calc(14px * var(--fs));
  letter-spacing:.05em;border-radius:12px;padding:14px 22px;cursor:pointer;
  border:1px solid var(--line);background:var(--ink-3);color:var(--fg);min-width:215px}

.tag{font-size:calc(10px * var(--fs));letter-spacing:.15em;text-transform:uppercase;
  color:var(--danger-text);border:1px solid var(--danger);border-radius:99px;padding:3px 10px}
.fullad{position:fixed;inset:0;background:var(--sheet);z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:11px;text-align:center;padding:20px}
.fullad .big{font-family:Lexend,sans-serif;font-size:13px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}

.skip{margin-top:6px;background:var(--ink-3);border:1px solid var(--dim);color:var(--fg);

  font-size:13px;cursor:pointer}

.sheet{position:fixed;inset:0;background:rgba(var(--sheet-rgb),.975);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  z-index:20;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:0;                 /* the pinned footer carries the bottom spacing */
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;
  position:sticky;z-index:1;flex-wrap:wrap;background:var(--sheet);
  top:calc(-16px - env(safe-area-inset-top,0px));
  margin-top:calc(-16px - env(safe-area-inset-top,0px));
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:8px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheethead .tabs{flex:1 0 100%;position:static;padding-top:6px}
/* The way out has to be obvious to someone who has never used a menu: a big
   labelled pill at the top, and a full-width button pinned to the bottom that

.sheethead .close{margin-left:auto;display:flex;align-items:center;justify-content:center;gap:7px;

.sheetfoot{position:sticky;bottom:0;z-index:2;margin-top:auto;flex:0 0 auto;
  display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(var(--sheet-rgb),0),var(--sheet) 16px)}
.gobtn{flex:1 1 200px;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font-family:Lexend,sans-serif;font-weight:700;font-size:min(calc(18px * var(--fs)),30px);
  letter-spacing:.02em;cursor:pointer;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.gobtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.footzoom{flex:1 1 100%;order:-1;min-height:46px;border:1px solid var(--accent);border-radius:14px;
  background:var(--ink-3);color:var(--accent);font-family:Lexend,sans-serif;font-weight:700;
  font-size:min(calc(14px * var(--fs)),22px);padding:6px 14px;cursor:pointer}

  font-size:min(calc(16px * var(--fs)),28px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0;min-width:0;overflow-wrap:anywhere}
.sheet p{margin:0;font-size:calc(15px * var(--fs));line-height:1.55;color:var(--dim)}

.step{display:flex;gap:12px;align-items:flex-start}
/* web build: putting the game on an iPhone's Home Screen, in big steps */
.howto{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.howto li{display:flex;gap:13px;align-items:flex-start;font-size:calc(19px * var(--fs));line-height:1.4;color:var(--fg)}
.howto .num{flex:0 0 auto;width:calc(36px * var(--fs));height:calc(36px * var(--fs));border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:calc(18px * var(--fs));
  display:flex;align-items:center;justify-content:center;margin-top:-2px}

.ico{display:inline-block;vertical-align:-.32em;width:1.55em;height:1.55em;margin:0 .12em}
.howto .ui,.note .ui,.callout .ui{display:inline-block;max-width:100%;box-sizing:border-box;vertical-align:baseline;
  border:1px solid var(--line);background:var(--ink-3);border-radius:8px;padding:0 .35em;font-weight:700;
  white-space:normal;overflow-wrap:anywhere}

.fbtext,.fbname input{-webkit-user-select:text;user-select:text;box-sizing:border-box;width:100%;
  font-family:Lexend,sans-serif;font-size:max(16px,calc(18px * var(--fs)));line-height:1.45;color:var(--fg);
  background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fbtext{min-height:calc(150px * var(--fs));resize:vertical}

/* a small banner that slides in under the HUD and leaves on its own */
/* Toasts. Everything raised in one tick is shown together, and never more than
   three at a time: a big first run can cross half the score track and a few
   badges at once, and eleven banners over the board helped nobody. A burst of
   unlocks (the ones starting with ✦) shows its first entries and then one line
   pointing at the Unlocks sheet; the game-over card lists every one anyway. */
var TOAST_MAX=3, toastQ=[], toastTimer=0;
function toastBox(){
  var b=document.getElementById("toasts");
  if(!b){ b=document.createElement("div"); b.id="toasts"; document.body.appendChild(b); }
  return b;
}
function toast(msg){
  toastQ.push(String(msg));
  if(!toastTimer) toastTimer=setTimeout(flushToasts,0);
}
function showToast(msg){
  var el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  toastBox().appendChild(el);
  setTimeout(function(){ el.classList.add("out"); },2600);
  setTimeout(function(){ el.remove(); },3100);
}
function liveToasts(){ var n=0; try{ document.querySelectorAll("#toasts .toast").forEach(function(t){ if(!t.classList.contains("out")) n++; }); }catch(e){} return n; }
function flushToasts(){
  toastTimer=0;
  var batch=toastQ.splice(0,toastQ.length);
  var unlocks=batch.filter(function(m){ return m.charAt(0)==="\u2726"; });
  var others=batch.filter(function(m){ return m.charAt(0)!=="\u2726"; });
  // a fresh action replaces older notes rather than queueing behind them
  others=others.slice(-1);
  others.forEach(showToast);
  // the first of a burst always shows in full: when the fourth mode opens, its
  // announcement leads the burst that also carries the "Earned It" badge
  var room=Math.max(2,TOAST_MAX-liveToasts());
  if(unlocks.length>room){
    var keep=unlocks.slice(0,room-1), rest=unlocks.length-keep.length;
    keep.push(keep.length ? "\u2726 and "+rest+" more \u2014 see Unlocks"
                          : "\u2726 "+rest+" new unlocks \u2014 see Unlocks");
    unlocks=keep;
  }
  unlocks.forEach(showToast);
}

var AC=null, master=null, muted=false, placeTick=0;
var PENT=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
function audioInit(){
  if (muted) return;
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      AC=new C(); master=AC.createGain(); master.gain.value=.3; master.connect(AC.destination); }
    if(AC.state==="suspended") AC.resume();
  }catch(e){ AC=null; }
}
function tone(o){
  if(!AC||muted) return;
  try{
    var t0=AC.currentTime+(o.delay||0), osc=AC.createOscillator(), g=AC.createGain();
    osc.type=o.type||"sine"; osc.frequency.setValueAtTime(o.freq,t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t0+o.dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.peak||.3,t0+(o.attack||.006));
    g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+o.dur+.03);
  }catch(e){}
}
function click(dur,peak,centre){
  if(!AC||muted) return;
  try{
    var n=Math.max(1,Math.floor(AC.sampleRate*dur)), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var s=AC.createBufferSource(); s.buffer=b;
    var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=centre; bp.Q.value=1.2;
    var g=AC.createGain(); g.gain.value=peak;
    s.connect(bp); bp.connect(g); g.connect(master); s.start();
  }catch(e){}
}

/* ============================ geometry ============================ */
function cx(c){ return R + 1.5*R*c; }
function cy(c,r){ return H - (SQ3*R/2) - (SQ3*R*r + (c%2===1 ? SQ3*R/2 : 0)); }
function neighbors(c,r){
  var dr = (c%2===0) ? -1 : 1;
  return [[c,r+1],[c,r-1],[c-1,r],[c-1,r+dr],[c+1,r],[c+1,r+dr]];
}
function cellAt(c,r){ if(c<0||c>=COLS||r<0) return null; return cols[c][r]||null; }
function fitRail(force){
  try{ fitRailNow(force); }catch(e){}     // a layout nicety: never let it stop the game
}
function fitRailNow(force){
  var r=$("rail"); if(!r||r.hidden||!r.querySelector) return;
  var g=r.querySelector(".railgrp"), k=r.querySelector(".ctrls"), fs="";
  if(!g||!r.classList) return;
  try{ fs=getComputedStyle(document.documentElement).getPropertyValue("--font-scale"); }catch(e){}
  var key=r.clientWidth+"|"+fs;
  if(!force&&key===r.__fit) return;
  var lv=["c1","c2","c3","c4"], i=0;
  function over(){
    return g.scrollWidth>g.clientWidth+1||r.scrollWidth>r.clientWidth+1||
      (k&&!r.classList.contains("c4")&&g.getBoundingClientRect().right>k.getBoundingClientRect().left+1);
  }
  lv.forEach(function(c){ r.classList.remove(c); });
  while(i<lv.length&&over()) r.classList.add(lv[i++]);
  r.__fit=r.clientWidth+"|"+fs;
}
function watchRail(){
  var r=$("rail"); if(!r||!window.ResizeObserver) return;
  var pending=false;
  try{ new ResizeObserver(function(){
    if(pending) return; pending=true;
    requestAnimationFrame(function(){ pending=false; fitRail(); });
  }).observe(r); }catch(e){}
}
function layout(){
  var aw=board.clientWidth, ah=board.clientHeight;
  fitRail();
  if(!aw||!ah) return;
  R=Math.max(14,Math.min(52,Math.min(aw/(WU+.3), ah/(HU+.35))));
  W=WU*R; H=HU*R;
  var dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ============================ dealer ============================ */
function riseEvery(){ return Math.max(M.riseMin, M.riseMax - Math.floor(drops/M.ramp)); }
function maxHeight(){ var m=0; for(var c=0;c<COLS;c++) if(cols[c].length>m) m=cols[c].length; return m; }
function totalCells(){ var n=0; for(var c=0;c<COLS;c++) n+=cols[c].length; return n; }
function mergeReady(urgent){
  var tall=MAXH-2, hit={};
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++){
    var t=cols[c][r].tier;
    if(t>=M.pool||hit[t]) continue;
    var nb=neighbors(c,r);
    for(var i=0;i<nb.length;i++){
      var nc=nb[i][0], o=cellAt(nc,nb[i][1]);
      if(!o||o.tier!==t) continue;
      if(!urgent||cols[c].length>=tall||cols[nc].length>=tall){ hit[t]=true; break; }
    }
  }
  return Object.keys(hit).map(Number);
}
function pickWeighted(){
  // flat-ish across the drop pool, with the lowest tier slightly favoured
  var n=M.pool, w=[], s=0, i;
  for(i=0;i<n;i++){ w[i]=1+(n-i)*0.08; s+=w[i]; }
  var x=Math.random()*s, a=0;
  for(i=0;i<n;i++){ a+=w[i]; if(x<a) return i; }
  return 0;
}
function rollTier(){
  var h=maxHeight()/(MAXH-1), decay=Math.max(.3,1-drops/110);
  if(h>.78){
    var u=mergeReady(true), pool=u.length?u:mergeReady(false);
    if(pool.length && Math.random()<(h-.78)*1.8*decay) return pool[(Math.random()*pool.length)|0];
  }
  return pickWeighted();
}
function refillBag(){ while(bag.length<4) bag.push(rollTier()); }

/* ============================ actions ============================ */
function makeCell(t,pw){ return {tier:t,id:++uid,vy:null,sc:1,power:pw||null}; }

function drop(c){
  if(state!=="idle"||gameOver||screen!=="game") return false;
  if(c<0||c>=COLS||cols[c].length>=MAXH) return false;
  audioInit();
  var cell=makeCell(bag.shift());
  cell.vy=cy(c,MAXH+1.5);
  cols[c].push(cell);
  focusId=cell.id; mergedThisDrop=false; drops++; moveOpen=true;
  if(!M.timed && drops>=nextRiseAt){ pendingRise=true; nextRiseAt=drops+riseEvery(); }
  refillBag(); holdUsed=false; combo=0; state="settling";
  sfxPlace(cols[c].length/MAXH);
  if(cols[c].length>=MAXH-1) sfxDanger();
  paintChips();
  return true;
}
function doHold(){
  if(state!=="idle"||gameOver||holdUsed||screen!=="game") return;
  audioInit();
  var cur=bag[0];
  if(held===null){ held=cur; bag.shift(); refillBag(); } else { bag[0]=held; held=cur; }
  holdUsed=true; click(.04,.12,900); paintChips();

function allSettled(){
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++){
    var cell=cols[c][r];
    if(cell.vy===null) return false;
    if(Math.abs(cell.vy-cy(c,r))>.6) return false;
  }
  return true;
}
function findGroups(){
  var seen={}, out=[];
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++){
    var key=c+":"+r;
    if(seen[key]) continue;
    var tier=cols[c][r].tier, st=[[c,r]], grp=[];
    seen[key]=true;
    while(st.length){
      var p=st.pop(); grp.push(p);
      var nb=neighbors(p[0],p[1]);
      for(var i=0;i<nb.length;i++){
        var nc=nb[i][0], nr=nb[i][1], k2=nc+":"+nr;
        if(seen[k2]) continue;
        var o=cellAt(nc,nr);
        if(o&&o.tier===tier){ seen[k2]=true; st.push([nc,nr]); }
      }
    }
    if(grp.length>=3) out.push({tier:tier,cells:grp});
  }
  return out;
}

/* Detonation. A power goes off three ways: the tile it sits on is merged, the
   player taps it, or another power takes it out. So this is a queue, not a
   single pass — anything a power destroys that is itself charged joins the
   back of the queue and goes off in turn. */
/* ============================ the power queue ============================ */
/* A power-up that is set off (tapped, merged, or caught in another power's
   blast) leaves the board at once, so its column drops a tile, and joins a
   queue. The queue fires one at a time: the next power flashes for a beat with
   everything it is about to destroy lit up, then goes off where it was. All the
   powers that go off in one run of the queue are one combo, and each pays more
   than the last. Nothing can lapse while the queue runs; when it empties, a
   short window lets the player tap another charged tile to keep it going. A
   board clear in the middle of a combo brings the floor straight up, so the
   next power always has something to hit. */
var PQ_FLASH_MS=300, PQ_WINDOW_MS=1800, PQ_MAX=24;
var pq=[], pqHead=null, pqTaps=[], pcombo=null;
function normalCells(){
  var n=0;
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++) if(!cols[c][r].power) n++;
  return n;
}
function destructive(p){ return p==="bomb"||p==="beam"||p==="prism"||p==="quake"; }
function queueBusy(){ return pq.length>0 || !!pqHead || pqTaps.length>0; }
function comboWindowOpen(){ return !!pcombo && !queueBusy() && state==="idle" && !gameOver; }
function resetPowers(){ pq=[]; pqHead=null; pqTaps=[]; pcombo=null; }
function enqueue(cell,c,r,mult,now){
  if(!cell||!cell.power||pq.length>=PQ_MAX) return;
  var y=cell.vy===null?cy(c,r):cell.vy, col=ICONS[cell.power].col;
  pq.push({power:cell.power,c:c,r:r,tier:cell.tier,mult:mult||1});
  if(!pcombo) pcombo={n:0,dbl:false,total:0,left:PQ_WINDOW_MS,fresh:false};
  burst(cx(c),y,col,10,R*5,R*3);
  addFx({type:"lift",x:cx(c),y:y,col:col,dur:.32});
  click(.03,.10,760+110*Math.min(8,pq.length));
}
/* where a queued power goes off: the slot it left, settled onto its column if
   the column has since dropped below it */
function pqSpot(e){ var len=cols[e.c]?cols[e.c].length:0; return {c:e.c, r:Math.min(e.r,len)}; }
function powerTargets(e){
  var s=pqSpot(e), out=[], c, r;
  if(e.power==="bomb"){
    [[s.c,s.r]].concat(neighbors(s.c,s.r)).forEach(function(n){ if(cellAt(n[0],n[1])) out.push(n); });
  } else if(e.power==="beam"){
    for(r=0;r<cols[s.c].length;r++) out.push([s.c,r]);
  } else if(e.power==="prism"){
    for(c=0;c<COLS;c++) for(r=0;r<cols[c].length;r++) if(cols[c][r].tier===e.tier) out.push([c,r]);
  } else if(e.power==="quake"){
    var order=[]; for(c=0;c<COLS;c++) order.push(c);
    order.sort(function(a,b){ return (cols[b].length-cols[a].length)||(a-b); });
    order.slice(0,2).forEach(function(q){
      for(var k=0;k<2&&k<cols[q].length;k++) out.push([q,cols[q].length-1-k]);
    });
  }
  return {spot:s, cells:out};
}
/* charged tiles tapped while the queue was busy lift off at the next quiet moment */
function liftTapped(now){
  var ids=pqTaps, remove={}, n=0, i, c, r;
  pqTaps=[];
  for(i=0;i<COLS;i++) remove[i]={};
  for(c=0;c<COLS;c++) for(r=0;r<cols[c].length;r++){
    var cell=cols[c][r];
    if(cell.armed) cell.armed=false;
    if(cell.power&&ids.indexOf(cell.id)>=0){
      remove[c][r]=true; enqueue(cell,c,r,Math.min(5,1+.4*chain),now); n++;
    }
  }
  if(n) compactColumns(remove,[]);
  return n>0;
}
function startFlash(now){
  var e=pq.shift(), t=powerTargets(e);
  pqHead={e:e, t0:now, until:now+PQ_FLASH_MS,
          ids:t.cells.map(function(q){ return cols[q[0]][q[1]].id; })};
  tone({freq:880+90*Math.min(8,pcombo?pcombo.n:0),type:"square",dur:.06,peak:.05});
}
function firePower(e,now){
  var t=powerTargets(e), remove={}, killed=0, lit=[], i;
  for(i=0;i<COLS;i++) remove[i]={};
  var px=cx(t.spot.c), py=cy(t.spot.c,t.spot.r), pcol=ICONS[e.power].col;
  t.cells.forEach(function(q){
    var cell=cols[q[0]][q[1]];
    if(!cell||remove[q[0]][q[1]]) return;
    remove[q[0]][q[1]]=true; killed++;
    var y=cell.vy===null?cy(q[0],q[1]):cell.vy;
    lit.push([cx(q[0]),y]);
    particles.push({x:cx(q[0]),y:y,tier:cell.tier,t:0});
    if(cell.power) enqueue(cell,q[0],q[1],e.mult,now);   // caught in the blast: it queues too
  });
  burst(px,py,pcol,16,R*9,R*4);
  if(lit.length) addFx({type:"flash",cells:lit,dur:.4});
  if(e.power==="bomb") addFx({type:"shock",x:px,y:py,col:pcol,dur:.55});
  else if(e.power==="beam") addFx({type:"beam",x:px,col:pcol,dur:.5});
  else if(e.power==="prism") addFx({type:"wash",col:pcol,a:.22,dur:.6});
  else if(e.power==="frost"){
    if(M.timed) riseAtMs+=8000; else nextRiseAt+=8;
    pendingRise=false;
    addFx({type:"frost",col:pcol,dur:.8});
  }
  else if(e.power==="quake"){
    t.cells.forEach(function(q){ addFx({type:"dust",x:cx(q[0]),y:cy(q[0],q[1]),col:pcol,dur:.5}); });
  }
  else if(e.power==="gold"){
    addFx({type:"wash",col:pcol,a:.18,dur:.7});
    for(var gi=0;gi<4;gi++) burst(Math.random()*W,Math.random()*H*.7,pcol,5,R*3,R*2);
  }
  // the combo: each power in it pays more than the last; Gold pays the whole
  // combo so far again and doubles everything after it
  if(!pcombo) pcombo={n:0,dbl:false,total:0,left:PQ_WINDOW_MS,fresh:false};
  pcombo.n++; pcombo.fresh=true;
  var n=pcombo.n, pts=Math.round((160*killed+400)*n*(e.mult||1));
  if(e.power==="gold"){ pts+=pcombo.total; pcombo.dbl=true; }
  else if(pcombo.dbl) pts*=2;
  score+=pts; pcombo.total+=pts;
  stats.fired[e.power]=1;
  if(n>stats.maxPowerChain) stats.maxPowerChain=n;
  explainOnce(n>1?"pcombo":e.power);
  mergedThisDrop=true;
  shakeAmp=Math.min(7,2.2+1.1*n); shakeUntil=now+Math.min(440,200+60*n);
  sfxBloom(Math.min(8,n+2));
  buzz(n>1?[40,30,40,30,60]:[45,25,25]);
  floatText(px,py,"+"+compactNum(pts),true);
  flashPower(POWERS[e.power].name.toUpperCase(),n,pts,killed);
  compactColumns(remove,[]);

}
function flashPower(name,n,pts,killed){

/* Rebuild the columns once a resolution step has decided what dies and what is
   born. Shared by merges, taps and anything else that removes cells. */
function compactColumns(remove,inserts){
  var byCol={};
  inserts.forEach(function(i){ (byCol[i.c]=byCol[i.c]||[]).push(i); });
  var newFocus=0;
  for(var c2=0;c2<COLS;c2++){
    var kept=[], map=[];
    for(var r2=0;r2<cols[c2].length;r2++){
      map[r2]=kept.length;
      if(!remove[c2][r2]) kept.push(cols[c2][r2]);
    }
    (byCol[c2]||[]).sort(function(a,b){return a.r-b.r;}).forEach(function(ins,i){
      var cell=makeCell(ins.tier,ins.power);
      cell.vy=cy(c2,Math.min(ins.r,kept.length)); cell.sc=1.55;
      kept.splice(Math.min(map[ins.r]+i,kept.length),0,cell);
      if(ins.focus) newFocus=cell.id;
    });
    cols[c2]=kept;
  }
  // a step that does not rebirth the player's tile keeps the one they aimed
  // with (a dangling id is harmless: nothing matches it, so the fallback runs)
  if(newFocus) focusId=newFocus;
}

/* Tapping a charged tile sets it off where it stands. It is worth less than
   firing the same power inside a cascade, which is the whole decision: cash it
   in now, or build something around it. */
function powerAt(px,py){
  var hit=R*0.74, best=null, bd=hit*hit;
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++){
    var cell=cols[c][r];
    if(!cell.power) continue;
    var dx=px-cx(c), dy=py-(cell.vy===null?cy(c,r):cell.vy), d=dx*dx+dy*dy;
    if(d<=bd){ bd=d; best=[c,r]; }
  }
  return best;
}
function tapPower(c,r,now){
  if(gameOver||screen!=="game") return false;
  var cell=cols[c]&&cols[c][r];
  if(!cell||!cell.power) return false;
  audioInit();
  if(state!=="idle"){
    // the queue is running: the tile joins this combo at the next quiet moment,
    // as part of the move already in play (no extra move)
    if(!pcombo) return false;                    // a plain move is still resolving
    if(pqTaps.indexOf(cell.id)<0) pqTaps.push(cell.id);
    cell.armed=true;
    return true;
  }
  // on a waiting board a tap is a move, as before. It lifts the tile off at
  // once (the column drops) and starts a combo, or keeps one going inside the
  // window after the last power.
  var remove={}, i;
  for(i=0;i<COLS;i++) remove[i]={};
  remove[c][r]=true;
  enqueue(cell,c,r,Math.min(5,1+.4*chain),now);
  compactColumns(remove,[]);
  drops++; moveOpen=true; mergedThisDrop=true;
  if(!M.timed&&drops>=nextRiseAt){ pendingRise=true; nextRiseAt=drops+riseEvery(); }
  paintScore();
  state="settling";
  return true;
}

function applyMerges(groups,now){
  var remove={}, inserts=[], bloomed=false, topSize=0, gained=0;
  var queued=0, forged=[], tallest=maxHeight(), forgeLeft=1;
  if(powersOnBoard()>=POWER_CAP) forgeLeft=0;
  for(var c=0;c<COLS;c++) remove[c]={};

  // speed component: merges landing inside the window stack a multiplier
  if(now-lastMergeAt<SPEED_WINDOW) speedStreak=Math.min(6,speedStreak+1); else speedStreak=0;
  lastMergeAt=now;
  var speedMult=1+0.2*speedStreak;
  // Cascades are the skill move, so they carry the most weight of anything in
  // the scoring: the within-drop cascade grows faster than squared, and the
  // across-drop chain multiplier runs to 5 instead of 3.
  var chainMult=Math.min(5,1+.4*chain);
  var comboMult=Math.pow(Math.max(1,combo),2.4);

  groups.forEach(function(g){
    var tgt=null;
    for(var i=0;i<g.cells.length;i++){
      var p=g.cells[i];
      if(cols[p[0]][p[1]].id===focusId){ tgt=p; break; }
    }
    if(!tgt){
      tgt=g.cells[0];
      g.cells.forEach(function(p){ if(p[1]<tgt[1]||(p[1]===tgt[1]&&p[0]<tgt[0])) tgt=p; });
    }
    var isFocus=cols[tgt[0]][tgt[1]].id===focusId;
    var fx_=cx(tgt[0]), fy=cols[tgt[0]][tgt[1]].vy;
    g.cells.forEach(function(p){
      remove[p[0]][p[1]]=true;
      var cell=cols[p[0]][p[1]];
      // a charged tile merged away joins the queue with the cascade behind it
      if(cell.power){ enqueue(cell,p[0],p[1],chainMult*Math.max(1,combo),now); queued++; }
      particles.push({x:cx(p[0]),y:cell.vy,tier:g.tier,t:0});
      burst(cx(p[0]),cell.vy,COLOR[g.tier],4+combo,R*5,R*3);
    });
    addFx({type:"pop",x:fx_,y:fy,col:COLOR[Math.min(TOPTIER,g.tier+1)],dur:.4});
    var jump=g.cells.length>=JUMP_AT?2:1;
    var pts=Math.round(12*(g.tier+1)*(g.tier+1)*g.cells.length*comboMult*chainMult*speedMult*jump);
    topSize=Math.max(topSize,g.cells.length);
    if(g.tier>=TOPTIER){ pts*=4; bloomed=true; }
    else {
      var pw=forgeLeft?earnedPower(g.cells.length,combo,chain,tallest):null;
      if(pw){ forged.push(pw); forgeLeft--; }
      inserts.push({c:tgt[0],r:tgt[1],tier:Math.min(TOPTIER,g.tier+jump),focus:isFocus,power:pw});
    }
    score+=pts; gained+=pts;
    floatText(fx_,fy,"+"+compactNum(pts),combo>=2||speedStreak>=2);
  });

  compactColumns(remove,inserts);

  var pushback=2*Math.max(0,combo-1);
  if(pushback){
    if(M.timed) riseAtMs+=pushback*900; else nextRiseAt+=pushback;
    if(pendingRise&&combo>=2) pendingRise=false;
  }
  stats.merges+=groups.length;
  if(combo>stats.maxCascade) stats.maxCascade=combo;
  if(bloomed) stats.topTiles++;
  if(mode==="hard") inserts.forEach(function(i){ if(i.tier>=5) stats.hardSix++; });
  var level=combo+chain+speedStreak;
  if(bloomed) sfxBloom(level); else sfxBreak(level,groups[0].tier,topSize);
  if(forged.length){ sfxForge(); explainOnce("charged"); } else buzz(combo>=2?[18,30,18]:14);
  shakeAmp=Math.min(4.5,1+groups.length*.5+combo*.7);
  shakeUntil=now+Math.min(300,110+combo*55);
  return {gained:gained,pushback:pushback,mult:comboMult*chainMult*speedMult,
          speed:speedStreak,big:topSize>=5||bloomed||queued>1,bloomed:bloomed,
          fired:queued,forged:forged.length};
}

function boardClear(now){
  // Down to the last tile or two. Sweep what's left, pay out, then the floor
  // comes straight back up so the empty board is a breath, not a holiday.
  var left=normalCells();
  stats.clears++;
  // charged tiles are never swept: they settle to the floor and wait
  for(var c=0;c<COLS;c++){
    var kept=[];
    for(var r=0;r<cols[c].length;r++){
      if(cols[c][r].power){ kept.push(cols[c][r]); continue; }
      particles.push({x:cx(c),y:cols[c][r].vy,tier:cols[c][r].tier,t:0});
    }
    cols[c]=kept;
  }
  focusId=0;
  for(var b=0;b<6;b++) burst(W/2,H/2,b%2?ACCENT:"#FFFFFF",14,R*9,R*5);
  // a cleaner sweep pays more: nothing left beats two stragglers
  var bonus=Math.round(2500*(1+chain*0.5)*(M.timed?1.2:1)*(1+(CLEAR_AT-left)*0.25));
  score+=bonus;
  for(var i=0;i<5;i++) rings.push({t:-i*0.12});
  clearFlashUntil=now+900;
  shakeAmp=5; shakeUntil=now+420;
  if(M.timed) riseAtMs=now+4000; else nextRiseAt=drops+CLEAR_RISE_IN;
  pendingRise=false;
  sfxClear();
  comboHead.textContent="BOARD CLEAR"; explainOnce("clear");
  comboHead.style.fontSize="42px";
  comboHead.classList.add("on");
  var d=document.createElement("div");
  d.className="drop"; d.textContent="+"+bonus.toLocaleString()+"  ·  floor rises in "+
    (M.timed?"4s":CLEAR_RISE_IN+" drops");
  d.addEventListener("animationend",function(){ d.remove(); });
  comboRail.appendChild(d);
  clearTimeout(comboTimer);
  comboTimer=setTimeout(function(){ comboHead.classList.remove("on"); },2400);
}

function pushRow(now){
  for(var c=0;c<COLS;c++){
    var cell=makeCell(pickWeighted());
    cell.vy=cy(c,-1.3);
    cols[c].unshift(cell);
  }
  addFx({type:"floor",col:"rgba(255,255,255,.7)",dur:.5});
  for(var d=0;d<COLS;d++) burst(cx(d),H-R*.2,"rgba(200,210,230,.8)",3,R*3,R*4);
  focusId=0; shakeAmp=3.2; shakeUntil=now+240; buzz([25,20,45]);
  tone({freq:74,type:"sawtooth",dur:.3,peak:.3,slide:55});
  tone({freq:150,type:"triangle",dur:.16,peak:.12,delay:.02,slide:112});
  click(.09,.14,420);
  if(M.timed) riseAtMs=now+riseEvery()*1000;
}
function toppedOut(){ for(var c=0;c<COLS;c++) if(cols[c].length>=MAXH) return true; return false; }

function seedBoard(){
  var lim=Math.min(3,M.pool);
  for(var r=0;r<SEED_ROWS;r++) for(var c=0;c<COLS;c++){
    var cell=makeCell((Math.random()*lim)|0);
    cell.vy=cy(c,r+5.5);
    cols[c].push(cell);
  }
  for(var g=0;g<140;g++){
    var gs=findGroups();
    if(!gs.length) break;
    gs.forEach(function(G){
      var p=G.cells[0];
      cols[p[0]][p[1]].tier=(G.tier+1+((Math.random()*2)|0))%lim;
    });
  }

/* ============================ save / restore ============================ */
var SAVE="hexdrop.run.v2";
/* "Now" for the purposes of a save: while paused, the clocks have not been
   shifted yet, so the right reference is the instant the pause began. */
function pauseRef(){
  if(sheetSince>=0) return sheetSince;
  if(awaySince>=0) return awaySince;
  return performance.now();
}
function saveRun(){
  if(screen!=="game"||gameOver) return;
  try{
    // The save has to carry the whole of the current drop, not just the board.
    // Leaving mid-cascade used to drop the focused tile, the pending floor rise
    // and the hold lock, which quietly changed where the merge landed and let a
    // player dodge a rise by ducking to the menu.
    var fc=-1, fr=-1;
    if(focusId) for(var c=0;c<COLS&&fc<0;c++) for(var r=0;r<cols[c].length;r++)
      if(cols[c][r].id===focusId){ fc=c; fr=r; break; }
    SS(SAVE, JSON.stringify({
      v:3, mode:mode, score:score, drops:drops, chain:chain, combo:combo, dev:devRun,
      runCount:runCount, bag:bag.slice(0,4), held:held, revived:revived,
      focus:[fc,fr], pendingRise:pendingRise, holdUsed:holdUsed,
      merged:mergedThisDrop, clearArmed:clearArmed, speedStreak:speedStreak, moveOpen:moveOpen,
      playMs:Math.round(playMs),
      mergeAgo:lastMergeAt?Math.max(0,pauseRef()-lastMergeAt):null,
      nextRiseAt:nextRiseAt, riseLeft:M.timed?Math.max(0,riseAtMs-pauseRef()):0,
      // powers already lifted off the board live only in the queue
      pq:(pqHead?[pqHead.e]:[]).concat(pq).map(function(e){ return {p:e.power,c:e.c,r:e.r,t:e.tier,m:e.mult}; }),
      pc:pcombo?{n:pcombo.n,d:pcombo.dbl?1:0,tot:pcombo.total,l:Math.round(pcombo.left)}:null,
      cols:cols.map(function(a){ return a.map(function(c){
        return c.power ? {t:c.tier,p:c.power} : c.tier; }); })
    }));
  }catch(e){}
}
function hasSave(){
  // A save that merely exists is not a save that works: validate it properly
  // here so a damaged one is never offered as Continue.
  try{
    var s=JSON.parse(LS(SAVE,"null"));
    if(!s || !MODES[s.mode] || !Array.isArray(s.cols) || s.cols.length!==COLS) return null;
    var tiers=MODES[s.mode].tiers;
    for(var c=0;c<COLS;c++){
      var a=s.cols[c];
      if(!Array.isArray(a) || a.length>MAXH) return null;
      for(var r=0;r<a.length;r++){
        var e=a[r], t=(e&&typeof e==="object")?e.t:e;
        // a tier outside the mode's ladder is damage, not something to clamp quietly
        if(typeof t!=="number" || !isFinite(t) || t!==Math.floor(t) || t<0 || t>=tiers) return null;
        if(e&&typeof e==="object" && e.p && !POWERS[e.p]) return null;
      }
    }
    if(typeof s.score!=="number" || !isFinite(s.score) || s.score<0) return null;
    // the rest of the run state: absent is fine (defaults apply), present must be
    // a real number — a string "12" would concatenate its way through the scoring
    var nums=["drops","chain","combo","speedStreak","playMs","nextRiseAt","riseLeft","mergeAgo","runCount"];
    for(var i=0;i<nums.length;i++){
      var v=s[nums[i]];
      if(v===undefined || v===null) continue;
      if(typeof v!=="number" || !isFinite(v) || v<0) return null;
    }
    if(s.bag!==undefined && (!Array.isArray(s.bag) || !s.bag.every(function(t){ return typeof t==="number"&&isFinite(t); }))) return null;
    if(s.focus!==undefined && !(Array.isArray(s.focus)&&s.focus.length===2&&typeof s.focus[0]==="number"&&typeof s.focus[1]==="number")) return null;
    if(s.pq!==undefined){
      if(!Array.isArray(s.pq)||s.pq.length>PQ_MAX) return null;
      for(var q=0;q<s.pq.length;q++){
        var pe=s.pq[q];
        if(!pe||typeof pe!=="object"||!POWERS[pe.p]) return null;
        if([pe.c,pe.r,pe.t].some(function(v){ return typeof v!=="number"||v!==Math.floor(v)||v<0; })) return null;
        if(pe.c>=COLS||pe.r>MAXH||pe.t>=tiers) return null;
        if(typeof pe.m!=="number"||!isFinite(pe.m)||pe.m<=0||pe.m>100) return null;
      }
    }
    if(s.pc!==undefined&&s.pc!==null){
      if(typeof s.pc!=="object"||[s.pc.n,s.pc.tot,s.pc.l].some(function(v){ return typeof v!=="number"||!isFinite(v)||v<0; })) return null;
    }
    return s;
  }catch(e){ return null; }
}
function clearSave(){ DEL(SAVE); }

/* ============================ run flow ============================ */
function setMode(m){
  mode = MODES[m] ? m : "zen";
  SS("hexdrop.lastmode",mode);
  M = MODES[mode];
  TOPTIER = M.tiers - 1;
  best = bestOf(mode);
}
function newRun(){
  cols=[]; for(var c=0;c<COLS;c++) cols[c]=[];
  score=0; revived=false; runCount++; drops=0; devRun=false;
  combo=0; chain=0; gameOver=false; focusId=0; pendingRise=false; moveOpen=false;
  speedStreak=0; lastMergeAt=0; clearArmed=false; runBadges=[]; playMs=0; resetPowers();
  nextRiseAt=riseEvery(); riseAtMs=performance.now()+riseEvery()*1000;
  bag=[]; uid=uid||0; refillBag(); held=null; holdUsed=false;
  particles=[]; floats=[]; rings=[]; sparks=[]; fx=[];
  seedBoard();
  state="settling";
  paintChips(); paintScore(); hideCombo(); clearSave();
}
function restoreRun(s){
  setMode(s.mode);
  uid=0;
  cols=(Array.isArray(s.cols)?s.cols:[]).slice(0,COLS).map(function(a){
    return (Array.isArray(a)?a:[]).slice(0,MAXH).map(function(e){
      var t=(e&&typeof e==="object")?e.t:e, pw=(e&&typeof e==="object")?e.p:null;
      return makeCell(Math.max(0,Math.min(TOPTIER, t|0)), POWERS[pw]?pw:null);
    });
  });
  while(cols.length<COLS) cols.push([]);
  score=s.score||0; drops=s.drops||0; chain=s.chain||0; runCount=s.runCount||1; devRun=!!s.dev;
  bag=(Array.isArray(s.bag)?s.bag:[]).filter(function(t){
    return typeof t==="number" && t>=0 && t<M.pool;
  }); refillBag();
  held=(typeof s.held==="number"&&s.held>=0&&s.held<M.tiers)?s.held:null;
  revived=!!s.revived;
  // resume mid-drop exactly where it left off
  combo=s.combo||0; gameOver=false; speedStreak=s.speedStreak||0;
  lastMergeAt=(typeof s.mergeAgo==="number")?performance.now()-s.mergeAgo:0;
  holdUsed=!!s.holdUsed; pendingRise=!!s.pendingRise;
  mergedThisDrop=!!s.merged; clearArmed=!!s.clearArmed;
  moveOpen=(typeof s.moveOpen==="boolean")?s.moveOpen:(!!s.merged||!!s.pendingRise);
  playMs=(typeof s.playMs==="number"&&s.playMs>=0)?s.playMs:0; runBadges=[];
  focusId=0;
  if(s.focus&&s.focus[0]>=0&&cols[s.focus[0]]&&cols[s.focus[0]][s.focus[1]])
    focusId=cols[s.focus[0]][s.focus[1]].id;
  nextRiseAt=s.nextRiseAt||drops+riseEvery();
  riseAtMs=performance.now()+((typeof s.riseLeft==="number"&&M.timed)?s.riseLeft:riseEvery()*1000);
  pq=(Array.isArray(s.pq)?s.pq:[]).map(function(e){ return {power:e.p,c:e.c,r:e.r,tier:e.t,mult:e.m}; });
  pqHead=null; pqTaps=[];
  pcombo=s.pc?{n:s.pc.n|0,dbl:!!s.pc.d,total:s.pc.tot,left:Math.min(PQ_WINDOW_MS,s.pc.l),fresh:false}:null;
  if(pq.length&&!pcombo) pcombo={n:0,dbl:false,total:0,left:PQ_WINDOW_MS,fresh:false};
  particles=[]; floats=[]; rings=[]; sparks=[]; fx=[];
  state="settling";
  paintChips(); paintScore(); hideCombo();
}
var prevBest=0;
function endRun(){
  gameOver=true; chain=0; hideCombo(); resetPowers();
  prevBest=best;                       // endRun moves `best`, so remember what it was
  if(score>best){ best=score; SS("hexdrop.best."+mode, String(best)); }
  stats.runs++; stats.lifetime+=score;
  if(score>stats.bestRun) stats.bestRun=score;
  if(M.timed && playMs/1000>stats.longestTimed) stats.longestTimed=Math.round(playMs/1000);
  checkBadges(); saveProgress();
  submitScore(); lbAfterRun();
  paintScore(); clearSave(); sfxOver(); buzz([60,40,90]); showGameOver();
}
function revive(){
  for(var c=0;c<COLS;c++){
    var gone=cols[c].splice(0,Math.min(2,cols[c].length));
    gone.forEach(function(cell){ particles.push({x:cx(c),y:cell.vy,tier:cell.tier,t:0}); });
  }
  revived=true; gameOver=false; chain=0; focusId=0; pendingRise=false; speedStreak=0; resetPowers();
  nextRiseAt=drops+riseEvery(); riseAtMs=performance.now()+riseEvery()*1000;
  state="settling"; sfxBloom(3); hideVeil();
}

/* ============================ effects ============================ */
var SPARK_CAP=260;
function burst(x,y,col,n,speed,up){
  // debris flung from a point; gravity pulls it down and it fades out
  for(var i=0;i<n;i++){
    if(sparks.length>=SPARK_CAP) sparks.shift();
    var a=Math.random()*Math.PI*2, v=speed*(0.45+Math.random()*0.8);
    sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0),col:col,
                 t:0,life:0.55+Math.random()*0.5,sz:1.6+Math.random()*2.2});
  }
}
function addFx(o){ o.t=0; fx.push(o); return o; }
/* Floating text stays inside the board and does not pile onto a float that is
   still fresh at the same spot — later ones step upward instead. */
function floatText(x,y,text,hot){
  var half=Math.min(W*0.46, (text.length*(hot?R*.30:R*.24))/2);
  x=Math.max(half+4, Math.min(W-half-4, x));
  var lift=0;
  floats.forEach(function(f){
    if(f.t<0.55 && Math.abs(f.x-x)<R*2.2 && Math.abs((f.y+f.lift)-y)<R*0.9) lift+=R*0.8;
  });
  floats.push({x:x,y:y-lift,lift:lift,text:text,t:0,hot:!!hot});
}
function stepFx(dt){
  var k=dt/1000;
  for(var i=sparks.length-1;i>=0;i--){
    var s=sparks[i];
    s.t+=k; if(s.t>=s.life){ sparks.splice(i,1); continue; }
    s.vy+=R*22*k; s.x+=s.vx*k; s.y+=s.vy*k;
  }
  for(var j=fx.length-1;j>=0;j--){
    var f=fx[j]; f.t+=k/(f.dur||0.6);
    if(f.t>=1) fx.splice(j,1);
  }
}
function drawSparks(){
  sparks.forEach(function(s){
    var life=1-s.t/s.life;
    ctx.globalAlpha=Math.min(1,life*1.6);
    ctx.fillStyle=s.col;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.sz*(0.4+0.6*life),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawFx(){
  fx.forEach(function(f){
    var t=f.t, e=1-(1-t)*(1-t);                 // ease-out
    if(f.type==="pop"){                          // a merge landing: flash disc + ring
      ctx.globalAlpha=(1-t)*.55; ctx.fillStyle=f.col;
      hexPath(f.x,f.y,R*(0.6+0.9*e)); ctx.fill();
    }
    else if(f.type==="shock"){                   // bomb: expanding shockwave
      ctx.globalAlpha=(1-t)*.9; ctx.lineWidth=R*.22*(1-t)+1; ctx.strokeStyle=f.col;
      ctx.beginPath(); ctx.arc(f.x,f.y,R*(0.4+2.6*e),0,Math.PI*2); ctx.stroke();
    }
    else if(f.type==="beam"){                    // beam: a bar of light down the column
      var w=R*1.5*(1-t*0.6);
      var g=ctx.createLinearGradient(f.x-w/2,0,f.x+w/2,0);
      g.addColorStop(0,"rgba(92,225,255,0)"); g.addColorStop(.5,f.col); g.addColorStop(1,"rgba(92,225,255,0)");
      ctx.globalAlpha=(1-t)*.75; ctx.fillStyle=g; ctx.fillRect(f.x-w/2,0,w,H);
    }
    else if(f.type==="wash"){                    // prism / gold: a colour wash over the board
      ctx.globalAlpha=(t<.2?t/.2:1-(t-.2)/.8)*f.a; ctx.fillStyle=f.col; ctx.fillRect(0,0,W,H);
    }
    else if(f.type==="flash"){                   // prism: every matching tile lights up
      ctx.globalAlpha=(1-t)*.8; ctx.fillStyle="#FFFFFF";
      f.cells.forEach(function(c){ hexPath(c[0],c[1],R*.92*(1+0.25*e)); ctx.fill(); });
    }
    else if(f.type==="frost"){                   // frost: a cold band rolls down from the meter
      ctx.globalAlpha=(1-t)*.5; ctx.fillStyle=f.col;
      ctx.fillRect(0,0,W,H*e*0.5);
      ctx.globalAlpha=(1-t)*.9; ctx.lineWidth=3; ctx.strokeStyle=f.col;
      ctx.beginPath(); ctx.moveTo(0,H*e*0.5); ctx.lineTo(W,H*e*0.5); ctx.stroke();
    }
    else if(f.type==="dust"){                    // quake / landing: a puff at a point
      ctx.globalAlpha=(1-t)*.35; ctx.fillStyle=f.col;
      ctx.beginPath(); ctx.ellipse(f.x,f.y,R*(0.5+1.4*e),R*(0.18+0.25*e),0,0,Math.PI*2); ctx.fill();
    }
    else if(f.type==="lift"){                    // a power lifting off the board into the queue
      ctx.globalAlpha=(1-t)*.9; ctx.lineWidth=3; ctx.strokeStyle=f.col;
      hexPath(f.x,f.y-R*.6*e,R*(0.7+0.5*e)); ctx.stroke();
    }
    else if(f.type==="floor"){                   // a new row shoves up: a line of grit
      ctx.globalAlpha=(1-t)*.6; ctx.fillStyle=f.col;
      ctx.fillRect(0,H-R*0.5*(1-e)-2,W,2);
    }
    ctx.globalAlpha=1;
  });
}

/* ============================ loop ============================ */
var last=0;
function frame(now){
  var dt=Math.min(48,now-last||16); last=now;
  rnow=now; demoTick(now);
  if(screen==="game"&&paused()){ render(now); requestAnimationFrame(frame); return; }
  if(screen==="game"){
    for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++){
      var cell=cols[c][r], t=cy(c,r);
      if(cell.vy===null) cell.vy=t;
      var d=t-cell.vy;
      if(Math.abs(d)<.6){
        if(cell.vy!==t && Math.abs(d)>.3 && cell.id===focusId && state==="settling"){
          // the dropped tile touches down: a squash and a puff of dust
          cell.sc=1.16; buzz(8);
          addFx({type:"dust",x:cx(c),y:t+R*.75,col:"rgba(255,255,255,.55)",dur:.35});
        }
        cell.vy=t;
      } else cell.vy+=d*Math.min(1,.345*(dt/16));
      if(cell.sc!==1){
        cell.sc+=(1-cell.sc)*Math.min(1,.22*(dt/16));
        if(Math.abs(1-cell.sc)<.001) cell.sc=1;
      }
    }
    if(!gameOver) playMs+=dt;
    stepFx(dt);
    for(var i=particles.length-1;i>=0;i--){ particles[i].t+=dt/260; if(particles[i].t>=1) particles.splice(i,1); }
    for(var j=floats.length-1;j>=0;j--){ floats[j].t+=dt/900; if(floats[j].t>=1) floats.splice(j,1); }
    for(var k=rings.length-1;k>=0;k--){ rings[k].t+=dt/900; if(rings[k].t>=1) rings.splice(k,1); }

    // Timed modes must rise on the clock even while the player sits still —
    // setting a pending flag alone meant a fast player simply outran it.
    if(M.timed && !gameOver && screen==="game" && state==="idle" && now>=riseAtMs){
      if(toppedOut()) endRun();
      else { pushRow(now); state="settling"; }
    }

    if(state==="settling"&&allSettled()){ state="resolving"; resolveAt=now+55; }
    if(state==="resolving"&&now>=resolveAt){
      var groups=findGroups();
      if(groups.length){
        combo++; mergedThisDrop=true;
        var res=applyMerges(groups,now);
        flashCombo(res); paintScore(); state="settling";
      } else if(pqTaps.length&&liftTapped(now)){
        state="settling";                          // tapped mid-combo: they lift off now
      } else if(pq.length){
        // between powers. A board cleared mid-combo is swept (charged tiles
        // stay) and the floor comes straight up so the next power has
        // something to hit; otherwise the next power starts its flash.
        var nc=normalCells();
        if(nc>CLEAR_AT+4) clearArmed=true;
        if(clearArmed&&nc<=CLEAR_AT){ clearArmed=false; boardClear(now); state="settling"; }
        else if(nc===0&&pq.some(function(e){ return destructive(e.power); })){ pushRow(now); state="settling"; }
        else { startFlash(now); state="powering"; }
      } else {
        // the queue has run dry: the window to keep the combo opens in full,
        // unless there is no charged tile left to tap, when it simply ends
        if(pcombo&&pcombo.fresh){
          pcombo.fresh=false;
          if(powersOnBoard()>0) pcombo.left=PQ_WINDOW_MS; else endCombo();
        }
        // The chain counts consecutive merging MOVES. This branch also runs
        // after a floor rise and after a restore, neither of which is a move,
        // so only a move that is still open gets to settle the chain.
        if(moveOpen){ chain = mergedThisDrop ? chain+1 : 0; moveOpen=false; }
        if(chain>stats.maxChain) stats.maxChain=chain;
        combo=0; mergedThisDrop=false;
        var cells=normalCells();                        // charged tiles never count toward a clear
        if(cells>CLEAR_AT+4) clearArmed=true;           // board has real substance again
        if(clearArmed && cells<=CLEAR_AT){
          clearArmed=false; boardClear(now); state="idle"; paintChips(); saveRun();
        }
        else if(pendingRise&&!toppedOut()){ pendingRise=false; pushRow(now); state="settling"; }
        else {
          pendingRise=false; state="idle"; paintChips();
          if(toppedOut()) endRun(); else { checkBadges(); saveRun(); }
        }
      }
    }
    if(state==="powering"&&pqHead&&now>=pqHead.until){
      var fe=pqHead.e; pqHead=null; firePower(fe,now); state="settling";
    }
    // the combo window drains only while the board waits for the player
    if(comboWindowOpen()){ pcombo.left-=dt; if(pcombo.left<=0) endCombo(); }
    paintBackground();
    render(now);
  }
  requestAnimationFrame(frame);
}

/* ============================ render ============================ */
/* The silhouette of a tile. The board's sockets stay hexagonal whatever the
   player picks; only the pieces change shape. */
function tilePath(x,y,rad,shape){
  var sh=shape||tileShape, i, a, n;
  if(sh==="circle"){ ctx.beginPath(); ctx.arc(x,y,rad*GEOM.circle,0,Math.PI*2); ctx.closePath(); return; }
  if(sh==="square"){
    var hs=rad*GEOM.squareHalf, cr=rad*GEOM.squareCorner;
    ctx.beginPath();
    ctx.moveTo(x-hs+cr,y-hs);
    ctx.arcTo(x+hs,y-hs,x+hs,y+hs,cr); ctx.arcTo(x+hs,y+hs,x-hs,y+hs,cr);
    ctx.arcTo(x-hs,y+hs,x-hs,y-hs,cr); ctx.arcTo(x-hs,y-hs,x+hs,y-hs,cr);
    ctx.closePath(); return;
  }
  if(sh==="diamond"){
    var d=rad*GEOM.diamondD, w=rad*GEOM.diamondW;
    ctx.beginPath(); ctx.moveTo(x,y-d); ctx.lineTo(x+w,y); ctx.lineTo(x,y+d); ctx.lineTo(x-w,y);
    ctx.closePath(); return;
  }
  if(sh==="octagon"){
    ctx.beginPath();
    for(i=0;i<8;i++){ a=Math.PI/8+Math.PI/4*i; var px=x+rad*GEOM.octagon*Math.cos(a), py=y+rad*GEOM.octagon*Math.sin(a);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath(); return;
  }
  if(sh==="round"){
    // a hexagon with its corners sanded off: arcTo between consecutive edges
    var pts=[]; for(i=0;i<6;i++){ a=Math.PI/180*(60*i); pts.push([x+rad*Math.cos(a),y+rad*Math.sin(a)]); }
    var cr2=rad*GEOM.roundCorner;
    ctx.beginPath();
    for(i=0;i<6;i++){
      var p0=pts[i], p1=pts[(i+1)%6], p2=pts[(i+2)%6];
      var mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2;
      if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my);
      ctx.arcTo(p1[0],p1[1],(p1[0]+p2[0])/2,(p1[1]+p2[1])/2,cr2);
    }
    ctx.closePath(); return;
  }
  hexPath(x,y,rad);
}
function hexPath(x,y,rad){
  ctx.beginPath();
  for(var i=0;i<6;i++){
    var a=Math.PI/180*(60*i), px=x+rad*Math.cos(a), py=y+rad*Math.sin(a);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function mix(a,b,t){
  function h(x){ return [parseInt(x.substr(1,2),16),parseInt(x.substr(3,2),16),parseInt(x.substr(5,2),16)]; }
  var A=h(a), B=h(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+
         Math.round(A[2]+(B[2]-A[2])*t)+")";
}
var lastBg="";
function paintBackground(){
  // the room darkens toward the palette's alarm colour as the stack climbs
  var danger=Math.min(1,Math.max(0,(maxHeight()/(MAXH-1)-0.35)/0.65));
  var col=mix(BG[0],BG[1],danger*danger);
  if(col!==lastBg){ lastBg=col; document.body.style.background=col; }
}
/* Where the last tap landed, for a moment: a ring at the finger and a faint
   glow on the column that took the tile, so a tap that lands a column over is
   easy to see. Under half a second, and shorter the faster you tap, so it
   never trails behind quick play; only the newest stays. A tap the board
   could not take (a tile still falling) is a plain grey ring. */
var tapMarks=[], lastTapAt=0, TAP_MAX_MS=450, TAP_MIN_MS=150;
function markTap(px,py,c,ok){
  if(screen!=="game") return;
  var now=performance.now(), gap=lastTapAt?now-lastTapAt:Infinity;
  lastTapAt=now;
  tapMarks.forEach(function(m){ m.end=Math.min(m.end,now+70); });
  var dur=Math.max(TAP_MIN_MS,Math.min(TAP_MAX_MS,gap*0.75));
  if(!ok) dur=Math.min(dur,260);
  tapMarks.push({x:px,y:py,c:c,ok:!!ok,t0:now,dur:dur,end:now+dur});
  while(tapMarks.length>3) tapMarks.shift();
}
// full strength for the first third of its life, then a straight fade; a mark
// cut short by a newer tap fades out over what is left
function tapAlpha(m,now){ return Math.max(0,Math.min(1,(m.end-now)/(m.dur*0.65))); }
function drawTapTint(now){
  tapMarks.forEach(function(m){
    if(!m.ok||m.c<0||m.c>=COLS) return;
    var a=tapAlpha(m,now); if(a>0) tintColumn(m.c,ACCENT,.22*a,.08*a);
  });
}
function drawTapRings(now){
  for(var i=tapMarks.length-1;i>=0;i--) if(now>=tapMarks[i].end) tapMarks.splice(i,1);
  tapMarks.forEach(function(m){
    var a=tapAlpha(m,now); if(a<=0) return;
    var k=Math.min(1,Math.max(0,(now-m.t0)/m.dur)), grow=reduceMotion?0:eo(k);
    ctx.beginPath(); ctx.arc(m.x,m.y,R*(.30+.20*grow),0,Math.PI*2);
    ctx.lineWidth=3;
    ctx.strokeStyle=m.ok?"rgba("+ACC_RGB+","+a.toFixed(3)+")":"rgba(205,214,228,"+(.6*a).toFixed(3)+")";
    ctx.stroke();
    if(m.ok){
      ctx.beginPath(); ctx.arc(m.x,m.y,R*.10,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,"+(.9*a).toFixed(3)+")"; ctx.fill();
    }
  });
}
/* ---- the power queue on the board ---- */
/* Each queued power sits as a ghost of its emblem on the spot it will go off,
   numbered by its place in the queue. The one about to go off grows and blinks
   for its flash, with everything it is about to destroy lit in its colour and
   its name above it, so what each power does can be read at a glance. */
function drawGhost(x,y,power,scale,alpha,badge){
  var rr=R*.46*scale, col=ICONS[power].col;
  ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
  ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2);
  ctx.fillStyle="rgba(8,11,16,.94)"; ctx.fill();
  ctx.lineWidth=Math.max(2,R*.08); ctx.strokeStyle=col; ctx.stroke();
  drawIcon(power,x,y,rr*.74);
  if(badge){
    var bx=x+rr*.8, by=y-rr*.8, br=Math.max(7,R*.2);
    ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    ctx.fillStyle="#0A0D12"; ctx.font="700 "+(br*1.25).toFixed(1)+"px Lexend, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(String(badge),bx,by+.5);
  }
  ctx.restore();
}
function cellPos(id){
  for(var c=0;c<COLS;c++) for(var r=0;r<cols[c].length;r++)
    if(cols[c][r].id===id) return {x:cx(c), y:cols[c][r].vy===null?cy(c,r):cols[c][r].vy};
  return null;
}
function drawPowerQueue(now){
  if(!pq.length&&!pqHead) return;
  pq.forEach(function(e,i){
    var sp=pqSpot(e);
    drawGhost(cx(sp.c),cy(sp.c,sp.r),e.power,.9,.85,i+(pqHead?2:1));
  });
  if(!pqHead) return;
  var e=pqHead.e, col=ICONS[e.power].col, k=Math.max(0,Math.min(1,(now-pqHead.t0)/PQ_FLASH_MS));
  var on=(k<.3)||(k>=.5&&k<.8), a=on?1:.4;           // two hard blinks inside the flash
  // everything that is not about to be hit dims, so the targets stand out
  // whatever their colour, the palette or the player's colour vision
  var tset={}; pqHead.ids.forEach(function(id){ tset[id]=1; });
  for(var dc=0;dc<COLS;dc++) for(var dr=0;dr<cols[dc].length;dr++){
    var dcell=cols[dc][dr]; if(tset[dcell.id]) continue;
    hexPath(cx(dc),dcell.vy===null?cy(dc,dr):dcell.vy,R*.95);
    ctx.fillStyle="rgba(6,9,14,.45)"; ctx.fill();
  }
  pqHead.ids.forEach(function(id){
    var q=cellPos(id); if(!q) return;
    hexPath(q.x,q.y,R*.95);
    ctx.globalAlpha=.5*a; ctx.fillStyle=col; ctx.fill();
    // the power's colour outside, then a dark and a white keyline: one of the
    // two always contrasts at least 4.5:1 with the tile underneath
    ctx.globalAlpha=Math.max(.6,a);
    ctx.lineWidth=3; ctx.strokeStyle=col; ctx.stroke();
    hexPath(q.x,q.y,R*.95-3); ctx.lineWidth=2; ctx.strokeStyle="rgba(6,9,14,.95)"; ctx.stroke();
    hexPath(q.x,q.y,R*.95-5); ctx.lineWidth=2; ctx.strokeStyle="#FFFFFF"; ctx.stroke();
    ctx.globalAlpha=1;
  });
  if(e.power==="frost"){ ctx.globalAlpha=.7*a; ctx.fillStyle=col; ctx.fillRect(0,0,W,8); ctx.globalAlpha=1; }
  if(e.power==="gold"){ ctx.globalAlpha=.6*a; ctx.lineWidth=6; ctx.strokeStyle=col; ctx.strokeRect(3,3,W-6,H-6); ctx.globalAlpha=1; }
  var sp=pqSpot(e), gx=cx(sp.c), gy=cy(sp.c,sp.r);
  drawGhost(gx,gy,e.power,1+.4*k,on?1:.75,0);
  ctx.save();
  ctx.font="700 "+Math.round(Math.max(13,R*.44))+"px Lexend, sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.lineWidth=4; ctx.strokeStyle="rgba(6,9,14,.9)"; ctx.fillStyle=col; ctx.globalAlpha=on?1:.8;
  var nm=POWERS[e.power].name.toUpperCase(), nx=Math.max(R*1.3,Math.min(W-R*1.3,gx)), ny=Math.max(R*.9,gy-R*.8);
  ctx.strokeText(nm,nx,ny); ctx.fillText(nm,nx,ny);
  ctx.restore();
}
/* the combo counter and, once the queue has run dry, the bar that drains while
   the player has time to tap another charged tile */
function drawComboWindow(now){
  if(!pcombo||gameOver) return;
  var waiting=comboWindowOpen();
  if(!waiting&&!queueBusy()) return;
  var frac=waiting?Math.max(0,pcombo.left/PQ_WINDOW_MS):1;
  var w=Math.min(W*.44,R*5.2), x0=(W-w)/2, y0=44;
  ctx.fillStyle="rgba(255,255,255,.14)"; ctx.fillRect(x0,y0,w,6);
  ctx.globalAlpha=waiting?.65+.35*Math.abs(Math.sin(now/120)):.95;
  ctx.fillStyle=ACCENT; ctx.fillRect(x0,y0,w*frac,6); ctx.globalAlpha=1;
  ctx.font="700 12px Lexend, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillStyle=ACCENT;
  var label=(pcombo.n>=2?"COMBO \u00d7"+pcombo.n:"")+(waiting?(pcombo.n>=2?"  \u00b7  ":"")+"tap a charged tile":"");
  if(label) ctx.fillText(label,W/2,y0-3);
}
/* tint one column's sockets, strongest at the red row, fading toward the floor */
function tintColumn(c,col,aTop,aBottom){
  ctx.fillStyle=col;
  for(var r=0;r<MAXH;r++){
    var f=MAXH>1?r/(MAXH-1):1, a=aBottom+(aTop-aBottom)*f;
    if(a<=.004) continue;
    hexPath(cx(c),cy(c,r),R*.92); ctx.globalAlpha=a; ctx.fill();
  }
  ctx.globalAlpha=1;
}
var rnow=0;
function render(now){
  rnow=now;
  ctx.clearRect(0,0,W,H);
  var shake=0;
  if(shakeOn&&now<shakeUntil) shake=Math.sin(now/17)*((shakeUntil-now)/280)*shakeAmp;
  ctx.save(); ctx.translate(0,shake);

  for(var c=0;c<COLS;c++){
    var h=cols[c].length;

      var over=(r===MAXH-1);

    }

  // the column's own sockets, not a band behind them: bands are wider than the
  // column spacing, so two tall neighbours used to paint a darker stripe where
  // they overlapped. Sockets never overlap.

  }

    var risky=cols[hoverCol].length>=MAXH-2;
    tintColumn(hoverCol,risky?DANGER:ACCENT,risky?.16:.12,risky?.07:.06);
    hexPath(cx(hoverCol),cy(hoverCol,cols[hoverCol].length),R*.92);
    ctx.lineWidth=2;
    ctx.strokeStyle=risky?"rgba("+DAN_RGB+",.85)":"rgba("+ACC_RGB+",.78)";
    ctx.stroke();
  }
  drawTapTint(now);
  for(var c2=0;c2<COLS;c2++) for(var r2=0;r2<cols[c2].length;r2++){
    var cell=cols[c2][r2];

    ctx.textAlign="center"; ctx.textBaseline="middle";

    ctx.fillText(f.text,f.x,f.y-30*f.t-R*.5);
    ctx.globalAlpha=1;

  ctx.setLineDash([5,6]); ctx.lineWidth=1.2; ctx.strokeStyle="rgba("+DAN_RGB+",.42)";
  ctx.beginPath(); ctx.moveTo(0,dy); ctx.lineTo(W,dy); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  drawComboWindow(now);

  if(now<clearFlashUntil){
    ctx.globalAlpha=((clearFlashUntil-now)/900)*.3;
    ctx.fillStyle=ACCENT; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }

  // rise meter
  var p, labelTxt;
  if(M.timed){
    var left=Math.max(0,(riseAtMs-now)/1000);
    p=1-Math.min(1,left/riseEvery());
    labelTxt="FLOOR RISES IN "+left.toFixed(1)+"s";
  } else {
    var n=Math.max(0,nextRiseAt-drops);

  }
  var close=p>.82;

  ctx.fillStyle=close?DANGER:ACCENT;
  ctx.globalAlpha=close?.95:.6; ctx.fillRect(0,0,W*p,4); ctx.globalAlpha=1;
  if(close&&!gameOver){

  ctx.textAlign="right"; ctx.textBaseline="top";
  ctx.fillStyle=close?DANGER:"rgba(255,255,255,.45)";
  ctx.fillText(labelTxt,W,9);

  // window draining beneath them while a streak is alive
  if(chain>0||speedStreak>0){
    var px0=8, py0=13, shown=Math.min(8,chain);

      ctx.globalAlpha=.9; ctx.fillStyle=ACCENT; ctx.fill(); ctx.globalAlpha=1;
    }
    if(chain>=2){
      ctx.font="700 10.5px Lexend, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillStyle="rgba(255,255,255,.55)";
      ctx.fillText("CHAIN "+chain,px0+shown*11+4,py0);
    }
    var left=lastMergeAt?Math.max(0,1-(now-lastMergeAt)/SPEED_WINDOW):0;
    if(speedStreak>0&&left>0){
      ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fillRect(px0-3,py0+8,70,2);
      ctx.fillStyle="#FFFFFF"; ctx.globalAlpha=.7; ctx.fillRect(px0-3,py0+8,70*left,2); ctx.globalAlpha=1;
      ctx.font="700 10.5px Lexend, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="top";
      ctx.fillStyle="rgba(255,255,255,.5)";
      ctx.fillText("FAST \u00D7"+(1+0.2*speedStreak).toFixed(1),px0-3+74,py0+5);

}

    Math.max(0,Math.min(255,((n>>8)&255)+amt))+","+Math.max(0,Math.min(255,(n&255)+amt))+")";
}

/* ============================ chips / hud ============================ */
function shapeSVGPath(sh,r){
  // the same silhouettes as tilePath, as SVG path data around (20,20)
  var i,a,p=[],cx0=20,cy0=20;
  if(sh==="circle"){ var rc=r*GEOM.circle; return "M"+(cx0-rc)+" "+cy0+" a"+rc+" "+rc+" 0 1 0 "+(2*rc)+" 0 a"+rc+" "+rc+" 0 1 0 "+(-2*rc)+" 0 Z"; }
  if(sh==="square"){ var hs=r*GEOM.squareHalf, cq=r*GEOM.squareCorner;
    return "M"+(cx0-hs+cq)+" "+(cy0-hs)+" H"+(cx0+hs-cq)+" Q"+(cx0+hs)+" "+(cy0-hs)+" "+(cx0+hs)+" "+(cy0-hs+cq)+
      " V"+(cy0+hs-cq)+" Q"+(cx0+hs)+" "+(cy0+hs)+" "+(cx0+hs-cq)+" "+(cy0+hs)+" H"+(cx0-hs+cq)+
      " Q"+(cx0-hs)+" "+(cy0+hs)+" "+(cx0-hs)+" "+(cy0+hs-cq)+" V"+(cy0-hs+cq)+" Q"+(cx0-hs)+" "+(cy0-hs)+" "+(cx0-hs+cq)+" "+(cy0-hs)+" Z"; }
  if(sh==="diamond"){ var d=r*GEOM.diamondD,w=r*GEOM.diamondW; return "M"+cx0+" "+(cy0-d)+" L"+(cx0+w)+" "+cy0+" L"+cx0+" "+(cy0+d)+" L"+(cx0-w)+" "+cy0+" Z"; }
  if(sh==="octagon"){ for(i=0;i<8;i++){ a=Math.PI/8+Math.PI/4*i; p.push((cx0+r*GEOM.octagon*Math.cos(a)).toFixed(1)+" "+(cy0+r*GEOM.octagon*Math.sin(a)).toFixed(1)); } return "M"+p.join(" L")+" Z"; }
  if(sh==="round"){
    // straight edges with the corners sanded: line to just short of each
    // vertex, then a quadratic through the vertex to just past it
    var pts=[]; for(i=0;i<6;i++){ a=Math.PI/180*(60*i); pts.push([cx0+r*Math.cos(a),cy0+r*Math.sin(a)]); }
    var k=GEOM.roundCorner, out="";
    for(i=0;i<6;i++){
      var p0=pts[(i+5)%6],p1=pts[i],p2=pts[(i+1)%6];
      var ain=[p1[0]+(p0[0]-p1[0])*k, p1[1]+(p0[1]-p1[1])*k];
      var aout=[p1[0]+(p2[0]-p1[0])*k, p1[1]+(p2[1]-p1[1])*k];
      out+=(i===0?"M":"L")+ain[0].toFixed(1)+" "+ain[1].toFixed(1)+" Q"+p1[0].toFixed(1)+" "+p1[1].toFixed(1)+" "+aout[0].toFixed(1)+" "+aout[1].toFixed(1)+" ";
    }
    return out+"Z";
  }
  for(i=0;i<6;i++){ a=Math.PI/180*(60*i); p.push((cx0+r*Math.cos(a)).toFixed(1)+" "+(cy0+r*Math.sin(a)).toFixed(1)); }
  return "M"+p.join(" L")+" Z";
}
function chipSVG(tier,styleKey,shapeKey){
  if(tier===null||tier===undefined)
    return '<circle cx="20" cy="20" r="11" fill="none" stroke="'+LINE+'" stroke-dasharray="3 4"/>';
  var st=styleKey||tileStyle, sh=shapeKey||tileShape;
  var d=shapeSVGPath(sh,17);
  var n=tier+1, rows=dotLayout(n), dots="", inkc=INKC[tier];
  if(st==="outline") inkc="#F3F6FB"; else if(st==="ink") inkc=INKLIFT[tier]||lift(COLOR[tier],true);
  else if(st==="glass"&&GLASS[tier]) inkc=GLASS[tier].ink;
  var gap=showNums?3.6:5.2, rowGap=showNums?2.7:5.4, rr=showNums?1.15:1.9;
  var baseY=showNums?10.6:20;
  if(!showDots){ dots=""; }
  else if(!showNums&&n===6){
    for(var k6=0;k6<6;k6++){ var ang=Math.PI/180*(60*k6+30);
      dots+='<circle cx="'+(20+6.4*Math.cos(ang)).toFixed(1)+'" cy="'+(20+6.4*Math.sin(ang)).toFixed(1)+
            '" r="'+rr+'" fill="'+inkc+'" opacity=".8"/>'; }
  } else {
    var y0=baseY-(rows.length-1)*rowGap/2;
    rows.forEach(function(cnt,ri){
      var x0=20-(cnt-1)*gap/2;
      for(var i2=0;i2<cnt;i2++)
        dots+='<circle cx="'+(x0+i2*gap).toFixed(1)+'" cy="'+(y0+ri*rowGap).toFixed(1)+
              '" r="'+rr+'" fill="'+inkc+'" opacity=".8"/>';
    });
  }
  var inner=(SHAPES[sh]&&SHAPES[sh].inner)||1;
  var num = !showNums ? ''
    : showDots
    ? '<text x="20" y="'+(20+6.2*inner).toFixed(1)+'" text-anchor="middle" font-family="'+numFont(sh).replace(/'/g,"")+'"'+
      ' font-weight="700" font-size="'+(15*inner).toFixed(1)+'" fill="'+inkc+'">'+n+'</text>'
    : '<text x="20" y="'+(20+7.2*inner).toFixed(1)+'" text-anchor="middle" font-family="'+numFont(sh).replace(/'/g,"")+'"'+
      ' font-weight="700" font-size="'+(20*inner).toFixed(1)+'" fill="'+inkc+'">'+n+'</text>';
  var poly;
  if(st==="outline")
    poly='<path d="'+d+'" fill="#131A26" stroke="'+lift(COLOR[tier],true)+'" stroke-width="3" stroke-linejoin="round"/>';
  else if(st==="ink")
    poly='<path d="'+d+'" fill="#090C12" stroke="'+(INKLIFT[tier]||lift(COLOR[tier],true))+'" stroke-width="2.2" stroke-linejoin="round"/>';
  else if(st==="glass")
    poly='<path d="'+d+'" fill="'+COLOR[tier]+'" fill-opacity="'+(GLASS[tier]?GLASS[tier].a:.66)+'" stroke="rgba(255,255,255,.6)" stroke-width="1.3" stroke-linejoin="round"/>';
  else
    poly='<path d="'+d+'" fill="'+COLOR[tier]+'" stroke="'+shade(COLOR[tier],-46)+'" stroke-width="1.6" stroke-linejoin="round"/>'+
      (CLASSIC[tier]?'<path d="'+d+'" fill="'+CLASSIC[tier]+'"/>':'');
  return poly+dots+num;
}
function paintChips(){

/* On-board text has no room for eight digits. The HUD stays exact; the floating
   numbers over the board round to something readable. */
function compactNum(n){
  if(n<10000) return n.toLocaleString();
  if(n<1000000) return (n/1000).toFixed(n<100000?1:0).replace(/\.0$/,"")+"K";
  return (n/1000000).toFixed(n<10000000?1:0).replace(/\.0$/,"")+"M";
}
/* The number shrinks as it gains digits, so a 9,000,000 run still fits the row
   at any system font size. Five digits keep the full size. */
function fitNum(el,text,base){
  if(!el) return;
  el.textContent=text;
  var over=Math.max(0,text.length-5);
  var k=Math.max(0.5,1-over*0.082);
  el.style.fontSize="calc("+(base*k).toFixed(2)+"px * var(--font-scale))";
}
function paintScore(){

var comboHead=document.getElementById("comboHead");
var comboRail=document.getElementById("comboRail");
var comboTimer=0;
function flashCombo(res){
  if(combo<2&&!res.big&&chain<2&&res.speed<2) return;
  var head, term;
  if(combo>=2){ head="CASCADE \u00d7"+combo; term="cascade"; }
  else if(res.bloomed){ head="BLOOM"; term="bloom"; }
  else if(res.speed>=2){ head="FAST \u00d7"+(1+0.2*res.speed).toFixed(1); term="fast"; }
  else if(res.big){ head="BIG CLEAR"; term=null; }
  else { head="CHAIN \u00d7"+chain; term="chain"; }
  comboHead.textContent=head;
  if(term) explainOnce(term);
  comboHead.style.fontSize=Math.min(58,26+8*Math.max(0,combo-1))+"px";
  comboHead.classList.add("on");
  try{ comboHead.animate([{transform:"scale(1.34)"},{transform:"scale(1)"}],
    {duration:230,easing:"cubic-bezier(.2,1.7,.4,1)"}); }catch(e){}
  var bits=["+"+res.gained.toLocaleString()];
  if(res.mult>1.01) bits.push(res.mult.toFixed(res.mult%1?2:0)+"×");
  if(res.speed>=2) bits.push("fast ×"+res.speed);
  if(res.pushback) bits.push("floor +"+res.pushback);
  var d=document.createElement("div");
  d.className="drop"; d.textContent=bits.join("  ·  ");
  d.addEventListener("animationend",function(){ d.remove(); });
  comboRail.appendChild(d);
  clearTimeout(comboTimer);
  comboTimer=setTimeout(function(){ comboHead.classList.remove("on"); },
    Math.min(2600,700+300*Math.max(1,combo)));
}
function hideCombo(){
  clearTimeout(comboTimer);
  comboHead.classList.remove("on");
  comboRail.innerHTML="";
}

/* ============================ zoom ============================ */
/* Menus, sheets and the game-over card can be pinched bigger. It is a text
   zoom, not a picture zoom: --zoom multiplies the font sizes inside those
   surfaces, so everything reflows and nothing is cropped off the edge. The
   board and the HUD never zoom. A pill appears to put it back. */
var zoom=1, pinch=null, ZOOM_MAX=2.2;
function zoomMax(){
  // the phone's own text size still applies, so cap the product
  var fs=1; try{ fs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--font-scale"))||1; }catch(e){}
  return Math.max(1,Math.min(ZOOM_MAX,2.6/fs));
}
function zoomSurface(el){
  try{ return el&&el.closest?el.closest(".sheet,#menu,.veil"):null; }catch(e){ return null; }
}
function zoomVisible(){ return screen==="menu" || sheetOpen() || !!document.getElementById("veil"); }
function setZoom(z,persist){
  zoom=Math.round(Math.max(1,Math.min(zoomMax(),z))*100)/100;
  if(Math.abs(zoom-1)<.03) zoom=1;
  try{ document.documentElement.style.setProperty("--zoom",String(zoom)); }catch(e){}
  try{ document.body.classList.toggle("zoomed",zoom>1); }catch(e){}
  if(persist!==false) SS("hexdrop.zoom",String(zoom));
  updateZoomBtn();
}
function updateZoomBtn(){
  var b=$("zoomReset"); if(!b) return;
  var fz=null; try{ fz=document.querySelector("#sheet .footzoom"); }catch(e){}
  if(fz){
    fz.hidden=!(zoom>1);
    var fp=fz.querySelector(".pct"); if(fp) fp.textContent=zoom>1?Math.round(zoom*100)+"%":"";
  }
  var on=zoom>1&&zoomVisible()&&!fz;
  b.hidden=!on; try{ b.style.display=on?"":"none"; }catch(e){}
  var pct=b.querySelector(".pct"); if(pct) pct.textContent=on?Math.round(zoom*100)+"%":"";
  // the text-size control in Settings follows along
  var seg=document.getElementById("optZoom");
  if(seg) seg.querySelectorAll(".mini").forEach(function(o){ o.classList.toggle("sel",zoomStep(parseFloat(o.getAttribute("data-zoom")))===zoomStep(zoom)); });
}
function zoomStep(z){ return z<1.17?"normal":z<1.52?"large":"largest"; }
function touchDist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy)||1; }
document.addEventListener("touchstart",function(e){
  if(e.touches.length!==2) return;
  if(!zoomSurface(e.target)||!zoomVisible()) return;
  pinch={d0:touchDist(e.touches),z0:zoom};
  e.preventDefault();                          // no two-finger scroll under the pinch
},{passive:false});
document.addEventListener("touchmove",function(e){
  if(!pinch) return;
  if(e.touches.length!==2){ pinch=null; return; }
  e.preventDefault();
  setZoom(pinch.z0*(touchDist(e.touches)/pinch.d0),false);
},{passive:false});
function endPinch(){ if(pinch){ pinch=null; setZoom(zoom,true); } }
document.addEventListener("touchend",function(e){ if(pinch&&e.touches.length<2) endPinch(); });
document.addEventListener("touchcancel",endPinch);
// a pinch on a desktop trackpad arrives as ctrl+wheel
document.addEventListener("wheel",function(e){
  if(!e.ctrlKey||!zoomSurface(e.target)||!zoomVisible()) return;
  e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.08:1/1.08),true);
},{passive:false});

/* ============================ sheets ============================ */
/* A sheet covers the board, so the run has to stop dead while it is open —
   reading the rules in Time Attack used to cost you the game. Everything the
   loop schedules against the clock is shifted forward by the time spent away. */
var sheetSince=-1, awaySince=-1;      // -1 means running; 0 is a valid instant
function paused(){ return sheetSince>=0 || awaySince>=0; }
function sheetOpen(){ return !!document.getElementById("sheet"); }
function resumeClocks(from){
  // everything the loop schedules against the wall clock moves forward by the
  // time the player was away, so a pause costs them nothing
  var away=performance.now()-from;
  if(!(away>0)) return;
  riseAtMs+=away; resolveAt+=away; shakeUntil+=away; clearFlashUntil+=away;
  if(pqHead){ pqHead.t0+=away; pqHead.until+=away; }
  if(lastMergeAt) lastMergeAt+=away;
  last=performance.now();
}
function closeSheet(){
  var s=document.getElementById("sheet");
  if(!s) return;
  s.remove(); demoStop(); updateZoomBtn();
  if(WEB) setTimeout(maybeOfferUpdate,250);
  if(sheetSince>=0){
    var from=sheetSince; sheetSince=-1;
    // closed while the app is hidden (programmatically — a tap cannot do it):
    // hand the pause to the away marker instead of resuming into a background
    // nobody can see; the visibility handler resumes it on return
    if(document.hidden && screen==="game" && !gameOver && awaySince<0) awaySince=from;
    else resumeClocks(from);
  }
}

function ladderHTML(top){

  }

function devDo(id,s){
  var inRun=screen==="game"&&!gameOver, c, r, i;
  if(inRun&&/^(fill|charge|rise|score|thin|over)$/.test(id)) devRun=true;
  if(id==="life1"||id==="life10"){ stats.lifetime+=id==="life1"?1e6:1e7; saveProgress(); checkBadges(); checkTrack(); }
  else if(id==="badgesAll"){ BADGES.forEach(function(b){ badges[b.id]=1; }); saveProgress(); }
  else if(id==="badgesNone"){ badges={}; saveProgress(); }
  else if(id==="runs25"){ stats.runs+=25; saveProgress(); checkBadges(); }
  else if(id==="gates"){ MODE_ORDER.forEach(function(m){ if(bestOf(m)<UNLOCK[m]) SS("hexdrop.best."+m,String(UNLOCK[m])); }); best=bestOf(mode); paintScore(); powerUnlocked(); paintModes(); }
  else if(id==="scores"){ MODE_ORDER.concat(["power"]).forEach(function(m){ DEL("hexdrop.best."+m); }); best=bestOf(mode); paintScore(); paintModes(); }
  else if(id==="seen"){ DEL("hexdrop.seen"); MODE_ORDER.concat(["power"]).forEach(function(m){ DEL("hexdrop.seen."+m); }); toast("Tutorials will show again"); }
  else if(id==="terms"){ TERMS.forEach(function(t){ DEL("hexdrop.term."+t.key); }); toast("Callouts will show again"); }
  else if(id==="fonts"){ warmFonts(); setTimeout(function(){ if(document.getElementById("sheet")) devRefresh(s); },1500); toast("Loading the fonts\u2026"); return; }
  else if(id==="ads"){ if(noAds) revokeNoAds(); else grantNoAds(); toast(noAds?"Ads off":"Ads back on"); }
  else if(id==="inter"){ closeSheet(); playFullscreen("Interstitial",6,2,function(){ toast("Interstitial finished"); }); return; }
  else if(id==="reward"){ closeSheet(); playFullscreen("Rewarded video",30,null,function(){ if(inRun) revive(); toast(inRun?"Rewarded \u2014 revived":"Rewarded ad finished"); },function(){ toast("Rewarded ad cancelled"); }); return; }
  else if(id==="reset"){
    if(Date.now()-resetArmedAt<4000){ resetArmedAt=0; resetApp(); return; }
    resetArmedAt=Date.now(); toast("Tap Reset again within 4 seconds to wipe everything");
  }
  else if(!inRun){ toast("Start a run first"); return; }
  else if(id==="fill"){
    // stack it high without handing out a merge: each new tile takes a number
    // none of its neighbours has
    for(c=0;c<COLS;c++) while(cols[c].length<MAXH-2){
      r=cols[c].length; var used={}, pick=0;
      neighbors(c,r).forEach(function(n){ var cl=cellAt(n[0],n[1]); if(cl) used[cl.tier]=1; });
      for(i=0;i<M.pool;i++) if(!used[i]){ pick=i; break; }
      cols[c].push(makeCell(pick,null));
    }
    for(c=0;c<COLS;c++) for(r=0;r<cols[c].length;r++) if(cols[c][r].vy===null) cols[c][r].vy=cy(c,r);
    closeSheet(); return;
  }
  else if(id==="charge"){
    var kinds=["bomb","beam","prism","gold"], placed=0;
    for(c=0;c<COLS&&placed<4;c++) if(cols[c].length){ var cell=cols[c][cols[c].length-1]; if(!cell.power){ cell.power=kinds[placed++]; } }
    if(placed<4) toast("Only "+placed+" tiles to charge"); closeSheet(); return;
  }
  else if(id==="rise"){ pendingRise=true; if(state==="idle") state="settling"; closeSheet(); return; }
  else if(id==="score"){ score+=1000000; paintScore(); closeSheet(); return; }
  else if(id==="thin"){
    var left=4;
    for(c=0;c<COLS;c++){ var keep=Math.min(cols[c].length,left); cols[c]=cols[c].slice(0,keep); left-=keep; }
    for(c=0;c<COLS;c++) for(r=0;r<cols[c].length;r++) cols[c][r].vy=cy(c,r);
    closeSheet(); return;
  }
  else if(id==="over"){ closeSheet(); endRun(); return; }
  devRefresh(s);
}
