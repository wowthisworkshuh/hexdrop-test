var lastGoad="";
function retryLine(){
  var gap=prevBest-score, pool;
  if(score>prevBest&&score>0&&prevBest>0) pool=GOADS.best;
  else if(score===prevBest&&score>0) pool=GOADS.tied;
  else if(prevBest>0&&gap>0&&gap<=Math.max(400,prevBest*0.06)) pool=GOADS.close;
  else if(runCount<=3) pool=GOADS.early;
  else if(mode==="power") pool=GOADS.power;
  else if(revived) pool=GOADS.revived;
  else if(drops<=14) pool=GOADS.short;
  else if(drops>=110) pool=GOADS.long;
  else pool=GOADS.general;
  var pick=pool[(Math.random()*pool.length)|0];
  if(pool.length>1&&pick===lastGoad) pick=pool[(pool.indexOf(pick)+1)%pool.length];
  lastGoad=pick;
  return pick.replace("$GAP",gap.toLocaleString());
}

function playFullscreen(label,secs,skipAfter,onDone,onCancel){

      window.__adFinished=function(ok){
        window.__adFinished=null;
        if(ok===false&&onCancel) onCancel(); else onDone();
      };
      window.AndroidAds.show(label.indexOf("Reward")===0?"rewarded":"interstitial");
      return;
    }catch(e){ window.__adFinished=null; }
  }
  var a=document.createElement("div");
  a.className="fullad";
  a.innerHTML='<div class="big">'+label+'</div><div class="ctr" id="adctr">'+secs+
    '</div><div class="big">simulated placeholder</div>'+
    (skipAfter!==null?'<button class="skip" id="adskip" type="button" disabled>Skip</button>':"");
  document.body.appendChild(a);
  var n=secs, iv=setInterval(function(){
    n--;
    var el=document.getElementById("adctr"); if(el) el.textContent=n;
    var sk=document.getElementById("adskip");
    if(sk&&skipAfter!==null&&secs-n>=skipAfter){ sk.disabled=false; }
    if(n<=0){ clearInterval(iv); a.remove(); onDone(); }
  },1000);
  var skbtn=a.querySelector("#adskip");
  if(skbtn) skbtn.onclick=function(){ clearInterval(iv); a.remove(); onDone(); };

function colFromX(clientX){
  var rect=cv.getBoundingClientRect();
  var c=Math.round((clientX-rect.left-R)/(1.5*R));
  return Math.max(0,Math.min(COLS-1,c));
}
cv.addEventListener("pointermove",function(e){ hoverCol=colFromX(e.clientX); });
cv.addEventListener("pointerleave",function(){ hoverCol=-1; });
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  // a charged tile is its own button; everything else in the column drops
  var rect=cv.getBoundingClientRect(), px=e.clientX-rect.left, py=e.clientY-rect.top;
  var hit=(state==="idle"&&!gameOver&&screen==="game") ? powerAt(px,py) : null;
  if(hit){ markTap(px,py,-1,tapPower(hit[0],hit[1],performance.now())); return; }
  hoverCol=colFromX(e.clientX);

/* Opt-in boards for today, this month and all time, per mode, shared by the

   name get different colours, with the hex code shown beside the name. A

  if(!rename) out+='<button class="optrow" id="lbNo" type="button">No thanks<span>you can still look at the boards</span></button>';
  return out;
}
// the id a new player will get, kept so the colour shown matches the colour sent
function lbDraftId(){ var d=LS("hexdrop.lb.draftId",""); if(!d){ d=newFeedbackId(); SS("hexdrop.lb.draftId",d); } return d; }
function wireLbJoin(s,opts){
  opts=opts||{};
  var inp=s.querySelector("#lbName"), msg=s.querySelector("#lbMsg");
  function check(show){ var why=nameProblem(inp.value); if(msg) msg.textContent=show?why:""; return !why; }
  if(inp) inp.addEventListener("input",function(){ if(msg&&msg.textContent) check(true); });
  var no=s.querySelector("#lbNo"); if(no) no.onclick=function(){ lbDecline(); };
  if(opts.first&&boardsReady()){
    lbFetch(opts.mode,"day",opts.score).then(function(d){
      var p=s.querySelector("#lbProbe");
      if(p&&d&&d.probe) p.textContent="Today that would put you #"+d.probe.rank+" of "+lbFmt(d.total+1)+".";
    });
  }
}
function lbSubmitJoin(opts){
  if(!boardsReady()){ toast("Online leaderboards are currently unavailable."); return; }
  var s=$("sheet"); if(!s) return;
  var inp=s.querySelector("#lbName"), msg=s.querySelector("#lbMsg"), why=nameProblem(inp?inp.value:"");
  if(why){ if(msg) msg.textContent=why; if(inp) inp.focus(); return; }
  var rename=!!(opts&&opts.rename);
  var me=lbGet("hexdrop.lb.me",null);
  if(!(me&&me.id)){ me={id:lbDraftId(),service:serviceUrl()}; lbPut("hexdrop.lb.me",me); DEL("hexdrop.lb.draftId"); }
  if(!lbJoin(inp.value)) return;
  me=lbGet("hexdrop.lb.me",null);
  closeSheet();
  toast(rename?"Your name is now "+me.name+".":navigator.onLine===false?"You’re joining as "+me.name+". You’ll appear once you’re online.":"You’re on the leaderboard as "+me.name+".");
  if(!rename&&opts&&(opts.first||opts.from==="board")){ lbMode=opts.mode||lbMode||mode; lbPeriod="day"; setTimeout(function(){ openSheet("board"); },350); }
}
function lbDecline(){
  SS("hexdrop.lb.choice","out"); closeSheet();
  toast("No problem. You can still look at the boards from the menu.");
}
function lbMaybeAsk(){
  if(!lbAsk) return;
  var a=lbAsk; lbAsk=null;
  setTimeout(function(){
    if(!document.getElementById("veil")||document.getElementById("sheet")) return;
    openSheet("lbjoin",{first:true,mode:a.mode,score:a.score});
  },1300);
}
/* ---- Settings > Options ---- */
function lbSettingsHTML(){
  var raw=lbGet("hexdrop.lb.me",null), me=lbMe();
  if(!boardsReady()||(raw&&raw.service&&raw.service!==serviceUrl())){
    if(!raw||!raw.id) return "";
    return '<h3 class="sh">Previous leaderboard data</h3>'+
      '<p class="note">'+(raw.service&&raw.service!==serviceUrl()?'Your previous name and scores belong to another leaderboard service. You can request deletion here.':'Online leaderboards are currently unavailable. You can still request deletion of your previous name and scores.')+'</p>'+
      '<button class="optrow" id="optLbLeave" type="button">'+(raw.leaving?'Retry deletion':'Delete my leaderboard data')+'<span>'+
      (Date.now()-lbLeaveArmedAt<4000?'tap again to confirm':raw.leaving?'waiting for service confirmation':'deletes your previous name and scores')+'</span></button>';
  }
  var out='<h3 class="sh">Leaderboard</h3>';
  if(me){
    var c=lbHex(me.color);
    out+='<button class="optrow" id="optLbName" type="button"><span><i class="lbdot" style="background:'+lbDotColor(c)+'"></i> '+lbEsc(me.name)+
      ' <small style="color:'+lbNameColor(c)+'">'+c+'</small></span><span>Change name ›</span></button>';
    out+='<button class="optrow" id="optLbLeave" type="button">Leave the leaderboard<span>'+
      (Date.now()-lbLeaveArmedAt<4000?'tap again to confirm':'deletes your name and scores')+'</span></button>';
  } else if(raw&&raw.leaving){
    out+='<p class="note">Deletion is waiting for service confirmation.</p>';
  } else {
    out+='<button class="optrow" id="optLbJoin" type="button">Join the leaderboard<span>opt in ›</span></button>';
  }
  return out;
}
function wireLbSettings(s){
  var n=s.querySelector("#optLbName"); if(n) n.onclick=function(){ openSheet("lbjoin",{rename:true}); };
  var j=s.querySelector("#optLbJoin"); if(j) j.onclick=function(){ openSheet("lbjoin",{}); };
  var l=s.querySelector("#optLbLeave"); if(l) l.onclick=function(){
    if(Date.now()-lbLeaveArmedAt<4000){
      lbLeaveArmedAt=0; lbLeave();
      toast("Deletion requested. No more scores will upload; your previous data is removed when the service confirms.");
    } else { lbLeaveArmedAt=Date.now(); toast("Tap Leave again within 4 seconds to delete your name and scores"); }
    var pane=s.querySelector("#setPane"); if(pane){ pane.innerHTML=settingsPane(settingsTab); wirePane(s); }
  };
}
function lbBoot(){
  lbBindOwner();
  if(!PUBLIC_BOARDS) DEL("hexdrop.lb.q"); // never upload results retained by an older build
  // the address may only arrive a moment later, from version.json: check then too
  function both(){ lbSync(); countActive(); lbRefresh(); }
  setTimeout(function(){ lbCheckService(both); },3000);
  window.addEventListener("online",function(){ setTimeout(both,1000); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) setTimeout(function(){ lbCheckService(both); },1200); });
}

/* ============================ player numbers ============================ */
/* Approximate anonymous activity reports, not verified people or installations.
   Each logical daily report has a fresh random event ID, retained only to retry
   that report. It is not a stable device/player identifier. The service rejects
   duplicate events. Monthly and new-copy flags remain estimates from this copy. */
function countOn(){ return LS("hexdrop.count","1")!=="0"&&navigator.globalPrivacyControl!==true; }
function countPlatform(){
  var p=webPlatform(), dev=p.iOS?"ios":p.android?"android":"other";
  var how=(window.AndroidAds||window.AndroidApp)?"app":WEB?(isStandalone()?"home":"web"):"page";
  return dev+"-"+how;
}
var counting=false;
function countActive(){
  if(counting||!countOn()||!serviceUrl()||navigator.onLine===false||!window.fetch) return;
  var caps=lbGet("hexdrop.lb.caps",{});
  if(!caps.count||!caps.countEventIds||caps.protocol<2||caps.url!==serviceUrl()) return;
  var now=Date.now(), d=lbDayKey(now), m=lbMonthKey(now), last=lbGet("hexdrop.count.last",{});
  var event=lbGet("hexdrop.count.pending",null);
  if(!event){
    if(last.d===d) return;
    var id=newFeedbackId(); if(!id) return;
    event={action:"count",eventId:id,d:d,m:m,month:last.m!==m,fresh:!last.d,p:countPlatform(),b:BUILD};
    lbPut("hexdrop.count.pending",event);
  }
  counting=true;
  lbPost(event).then(function(j){
    counting=false;
    if(j&&(j.ok||j.error==="old")){
      var pending=lbGet("hexdrop.count.pending",null);
      if(pending&&pending.eventId===event.eventId){
        lbPut("hexdrop.count.last",{d:event.d,m:event.m}); DEL("hexdrop.count.pending");
        if(event.d!==lbDayKey(Date.now())) countActive();
      }
    }
  },function(){ counting=false; });
}
function countSettingsHTML(){
  if(!serviceUrl()) return "";
  return '<label class="optrow" for="optCount">Send anonymous activity reports'+
    '<input type="checkbox" id="optCount"'+(countOn()?" checked":"")+(navigator.globalPrivacyControl===true?" disabled":"")+'></label>'+
    '<p class="note">'+(navigator.globalPrivacyControl===true
      ? 'Off: your browser asks sites not to share data (Global Privacy Control), so the game never reports.'
      : 'Once a day the game sends an approximate activity report with the kind of phone, version and a random retry ID used only for that report. No name or stable device ID.')+'</p>';
}

/* ============================ boot ============================ */
function wireZoom(){
  var b=$("zoomReset"); if(b) b.onclick=function(){ setZoom(1,true); toast("Back to normal size"); };
  var saved=parseFloat(LS("hexdrop.zoom","1")); if(saved>1) setZoom(saved,false); else updateZoomBtn();
}
function warmFonts(){
  watchRenderFonts();
  try{
    if(!document.fonts||!document.fonts.load) return;
    Object.keys(SHAPES).forEach(function(k){ document.fonts.load("700 24px "+SHAPES[k].font.split(",")[0]); });
    document.fonts.load("700 24px Lexend");
  }catch(e){}
}
function start(snap){
  uid=0;
  warmFonts(); wireZoom();
  var bt=$("buildTag");
  if(bt){
    bt.textContent="· "+BUILD+(debugOn?" · debug":"");
    if(debugOn) bt.classList.add("hot");
    bt.addEventListener("click",tapBuildTag);
  }
  loadSettings();
  setMode(LS("hexdrop.lastmode","zen"));
  setScreen("menu");
  paintModes();
  startWeb(); lbBoot(); watchRail();
  if(installNeeded()) openSheet("install",{then:LS("hexdrop.seen","0")!=="1"?"help":""});
  else if(LS("hexdrop.seen","0")!=="1"){ SS("hexdrop.seen","1"); openSheet("help",{first:true}); }
  requestAnimationFrame(function(t){ last=t; frame(t); });
}
function safeStart(snap){
  try { start(snap); }
  catch(err){
    try{
      var w=$("wrap");
      if(w) w.innerHTML='<div style="padding:24px;font:15px Lexend,sans-serif;color:#E9EEF7">'+
        '<b>Hex Drop could not start.</b><br><br><span style="color:#93A3BC">'+
        String(err&&err.message||err)+'</span></div>';
    }catch(e2){}
  }
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(safeStart);
else safeStart({});
})();
